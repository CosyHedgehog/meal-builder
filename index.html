<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Meal Builder</title>
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍋</text></svg>"
    />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap");

      :root {
        --bg: #f3f5ee;
        --surface: #ffffff;
        --surface-alt: #eaefe2;
        --ink: #1c2a1f;
        --ink-muted: #6e7a6a;
        --line: #dde3d3;
        --green: #3f6b4a;
        --green-light: #6fa47c;
        --green-soft: #e4eee3;
        --orange: #dd8034;
        --orange-soft: #fbeadc;
        --red: #c1442c;
        --red-soft: #f7e1da;
        --radius: 16px;
      }

      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family: "Inter", sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      h1,
      h2,
      h3 {
        font-family: "Fraunces", serif;
        margin: 0;
      }
      .mono {
        font-family: "IBM Plex Mono", monospace;
      }

      .app-shell {
        max-width: 1080px;
        margin: 0 auto;
        padding: 36px 24px 80px;
      }

      /* ---------- Header ---------- */
      header.top {
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        gap: 20px;
        flex-wrap: wrap;
        margin-bottom: 28px;
      }
      .eyebrow {
        font-family: "IBM Plex Mono", monospace;
        font-size: 11px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--green);
        margin-bottom: 6px;
      }
      h1.title {
        font-size: 34px;
        font-weight: 600;
        color: var(--ink);
      }
      .subtitle {
        color: var(--ink-muted);
        font-size: 14px;
        margin-top: 6px;
      }
      .header-actions {
        display: flex;
        gap: 10px;
        align-items: center;
      }
      .header-profile-btn {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 8px 12px;
        border-radius: 999px;
        border: 1px solid var(--line);
        background: var(--surface);
        color: var(--ink);
        transition:
          background 0.15s ease,
          border-color 0.15s ease,
          box-shadow 0.15s ease;
      }
      .header-profile-btn:hover {
        background: var(--surface-alt);
        border-color: rgba(28, 42, 31, 0.12);
        box-shadow: 0 2px 8px rgba(28, 42, 31, 0.06);
      }
      .header-profile-name {
        font-size: 13px;
        color: var(--ink-muted);
        line-height: 1.2;
      }
      .header-profile-icon {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-size: 15px;
        color: var(--ink);
      }

      button {
        font-family: "Inter", sans-serif;
        cursor: pointer;
        border: none;
      }
      .btn {
        padding: 10px 16px;
        border-radius: 999px;
        font-size: 13px;
        font-weight: 600;
        transition:
          transform 0.12s ease,
          box-shadow 0.12s ease;
      }
      .btn:active {
        transform: scale(0.97);
      }
      .btn-primary {
        background: var(--green);
        color: #fff;
      }
      .btn-primary:hover {
        box-shadow: 0 4px 14px rgba(63, 107, 74, 0.3);
      }
      .btn-secondary {
        background: var(--surface);
        color: var(--ink);
        border: 1px solid var(--line);
      }
      .btn-secondary:hover {
        background: var(--surface-alt);
      }
      .btn-danger {
        background: transparent;
        color: var(--red);
      }
      .btn-danger:hover {
        text-decoration: underline;
      }
      .btn-danger-outline {
        background: transparent;
        color: var(--red);
        border: 1px solid var(--red);
      }
      .btn-danger-outline:hover {
        background: rgba(193, 68, 44, 0.08);
      }

      /* ---------- Dial ---------- */
      .dial {
        width: 96px;
        height: 96px;
        border-radius: 50%;
        margin: 0 auto 14px;
        position: relative;
      }
      .dial-inner {
        position: absolute;
        inset: 9px;
        background: var(--surface);
        border-radius: 50%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }
      .dial-kcal {
        font-family: "IBM Plex Mono", monospace;
        font-weight: 600;
        font-size: 18px;
        line-height: 1;
      }
      .dial-kcal-label {
        font-size: 9px;
        color: var(--ink-muted);
        text-transform: uppercase;
        letter-spacing: 0.08em;
        margin-top: 3px;
      }

      /* ---------- Drawer ---------- */
      .backdrop {
        position: fixed;
        inset: 0;
        background: rgba(20, 28, 20, 0.32);
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.18s ease;
        z-index: 20;
      }
      .backdrop.open {
        opacity: 1;
        pointer-events: auto;
      }

      .drawer {
        position: fixed;
        top: 0;
        right: 0;
        height: 100vh;
        width: 400px;
        max-width: 92vw;
        background: var(--bg);
        box-shadow: -12px 0 30px rgba(20, 28, 20, 0.14);
        transform: translateX(100%);
        transition: transform 0.22s ease;
        z-index: 21;
        overflow-y: auto;
        padding: 26px 24px 40px;
      }
      .drawer.open {
        transform: translateX(0);
      }
      @media (prefers-reduced-motion: reduce) {
        .drawer,
        .backdrop {
          transition: none;
        }
      }

      .drawer-close {
        position: absolute;
        top: 20px;
        right: 20px;
        background: var(--surface);
        border: 1px solid var(--line);
        width: 32px;
        height: 32px;
        border-radius: 50%;
        font-size: 16px;
        color: var(--ink-muted);
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .drawer-close:hover {
        color: var(--ink);
      }

      .meal-name-input {
        font-family: "Fraunces", serif;
        font-size: 24px;
        font-weight: 600;
        border: none;
        background: transparent;
        width: 100%;
        padding: 4px 0;
        border-bottom: 1px solid transparent;
      }
      .meal-name-input:hover,
      .meal-name-input:focus {
        border-bottom: 1px solid var(--line);
        outline: none;
      }

      .drawer-dial-wrap {
        display: flex;
        justify-content: center;
        margin: 20px 0 6px;
      }
      .drawer-dial {
        width: 130px;
        height: 130px;
      }
      .drawer-dial .dial-inner {
        inset: 12px;
      }
      .drawer-dial .dial-kcal {
        font-size: 24px;
      }

      .section-label {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--ink-muted);
        margin: 22px 0 10px;
      }

      .item-row {
        display: grid;
        grid-template-columns: 16px minmax(0, 1fr) 72px 18px 56px 15px;
        align-items: center;
        gap: 8px;
        padding: 10px 0;
        border-bottom: 1px solid var(--line);
      }
      .item-drag {
        width: 16px;
        color: var(--ink-muted);
        cursor: grab;
        font-size: 13px;
        letter-spacing: 1px;
        flex: none;
      }
      .item-drag:active {
        cursor: grabbing;
      }
      .item-row.dragging {
        opacity: 0.4;
      }
      .item-row.drag-over {
        box-shadow: none;
      }
      .item-name {
        flex: 1;
        font-size: 14px;
        line-height: 1.3;
      }
      .item-unit {
        font-size: 11px;
        color: var(--ink-muted);
        text-align: center;
      }
      .item-qty {
        width: 100%;
        padding: 9px 10px;
        border: 1px solid var(--line);
        border-radius: 9px;
        font-family: "IBM Plex Mono", monospace;
        font-size: 13px;
        background: var(--bg);
        min-height: 40px;
      }
      .item-qty:focus {
        outline: 2px solid var(--green);
        outline-offset: 1px;
      }
      .item-kcal {
        width: 56px;
        text-align: right;
        font-family: "IBM Plex Mono", monospace;
        font-size: 12px;
        color: var(--ink-muted);
      }
      .item-head {
        display: grid;
        grid-template-columns: 16px 1fr 60px 18px 56px 15px;
        gap: 8px;
        align-items: center;
        padding: 0 0 6px;
        color: var(--ink-muted);
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
      }
      .item-head span:nth-child(5) {
        text-align: right;
      }
      .item-remove {
        background: none;
        color: var(--ink-muted);
        font-size: 15px;
        padding: 2px 4px;
      }
      .item-remove:hover {
        color: var(--red);
      }

      .add-item-row {
        display: flex;
        gap: 8px;
        margin-top: 12px;
        align-items: center;
      }
      .add-item-select {
        flex: 1;
        padding: 10px 12px;
        border: 1px solid var(--line);
        border-radius: 9px;
        background: var(--surface);
        font-size: 13px;
        min-height: 40px;
      }
      .add-item-qty {
        width: 72px;
        padding: 10px 9px;
        border: 1px solid var(--line);
        border-radius: 9px;
        font-family: "IBM Plex Mono", monospace;
        font-size: 13px;
        min-height: 40px;
      }

      .empty-note {
        color: var(--ink-muted);
        font-size: 13px;
        padding: 10px 0;
      }

      .drawer-footer {
        margin-top: 30px;
        padding-top: 16px;
        border-top: 1px solid var(--line);
        display: flex;
        justify-content: flex-end;
      }

      /* ---------- Ingredients modal ---------- */
      .modal-backdrop {
        position: fixed;
        inset: 0;
        background: rgba(20, 28, 20, 0.32);
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.18s ease;
        z-index: 30;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .modal-backdrop.open {
        opacity: 1;
        pointer-events: auto;
      }
      .modal {
        background: var(--surface);
        border-radius: 18px;
        width: 560px;
        max-width: 92vw;
        max-height: 84vh;
        overflow-y: auto;
        padding: 26px 26px 22px;
        position: relative;
      }
      .modal h2 {
        font-size: 21px;
        margin-bottom: 4px;
      }
      .modal .subtitle {
        margin-bottom: 18px;
      }
      .confirm-modal {
        width: 460px;
        max-width: 92vw;
      }
      .confirm-modal .modal-footer {
        justify-content: flex-end;
        gap: 10px;
      }
      .confirm-modal .modal-footer .btn {
        min-width: 110px;
      }
      #confirmModalBackdrop {
        z-index: 40;
      }
      #confirmModal {
        z-index: 41;
      }

      .ing-row {
        display: grid;
        grid-template-columns: 16px 1fr 70px 90px 30px;
        gap: 8px;
        align-items: center;
        padding: 7px 0;
        border-bottom: 1px solid var(--line);
      }
      .ing-row input,
      .ing-row select {
        padding: 6px 8px;
        border: 1px solid var(--line);
        border-radius: 8px;
        font-size: 13px;
        font-family: "Inter", sans-serif;
        background: var(--bg);
        width: 100%;
      }
      .ing-row .kcal-input {
        font-family: "IBM Plex Mono", monospace;
      }
      .ing-row.dragging {
        opacity: 0.4;
      }
      .ing-row.drag-over {
        box-shadow: none;
      }
      .ing-drag {
        color: var(--ink-muted);
        cursor: grab;
        font-size: 13px;
        letter-spacing: 1px;
        text-align: center;
      }
      .ing-drag.disabled {
        opacity: 0.25;
        cursor: default;
      }
      .ing-drag:active {
        cursor: grabbing;
      }
      .ing-head {
        display: grid;
        grid-template-columns: 16px 1fr 70px 90px 30px;
        gap: 8px;
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--ink-muted);
        padding-bottom: 6px;
      }
      .ing-remove {
        background: none;
        color: var(--ink-muted);
        font-size: 15px;
      }
      .ing-remove:hover {
        color: var(--red);
      }
      .ing-search {
        width: 100%;
        padding: 9px 12px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: var(--bg);
        font-size: 13px;
        margin: 14px 0 12px;
      }
      .ing-search-note {
        font-size: 11px;
        color: var(--ink-muted);
        margin: -6px 0 10px;
      }

      .add-ing-row {
        display: grid;
        grid-template-columns: 16px 1fr 70px 90px 30px;
        gap: 8px;
        margin-top: 12px;
        align-items: center;
      }

      .modal-footer {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: 20px;
        padding-top: 14px;
        border-top: 1px solid var(--line);
      }

      .export-textarea {
        width: 100%;
        height: 140px;
        font-family: "IBM Plex Mono", monospace;
        font-size: 11px;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 10px;
        background: var(--bg);
        resize: vertical;
        margin-top: 8px;
      }
      .import-row {
        display: flex;
        gap: 8px;
        margin-top: 10px;
        flex-wrap: wrap;
      }
      .file-label {
        display: inline-flex;
        align-items: center;
        padding: 9px 14px;
        border: 1px solid var(--line);
        border-radius: 999px;
        font-size: 13px;
        cursor: pointer;
        background: var(--surface);
      }
      .file-label:hover {
        background: var(--surface-alt);
      }
      .import-msg {
        font-size: 12px;
        margin-top: 8px;
      }
      .import-msg.ok {
        color: var(--green);
      }
      .import-msg.err {
        color: var(--red);
      }

      /* ---------- Auth ---------- */
      .auth-shell {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }
      .auth-card {
        width: 420px;
        max-width: 100%;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 20px;
        padding: 30px;
        box-shadow: 0 14px 40px rgba(28, 42, 31, 0.08);
      }
      .auth-card h1 {
        font-size: 30px;
        margin-bottom: 6px;
      }
      .auth-card .subtitle {
        margin-bottom: 22px;
      }
      .auth-tabs {
        display: flex;
        gap: 4px;
        background: var(--surface-alt);
        padding: 4px;
        border-radius: 10px;
        margin-bottom: 18px;
      }
      .auth-tab {
        flex: 1;
        padding: 9px;
        border-radius: 8px;
        background: transparent;
        color: var(--ink-muted);
        font-weight: 600;
        font-size: 13px;
      }
      .auth-tab.active {
        background: var(--surface);
        color: var(--ink);
        box-shadow: 0 1px 4px rgba(28, 42, 31, 0.08);
      }
      .auth-field {
        margin-bottom: 12px;
      }
      .auth-field label {
        display: block;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--ink-muted);
        margin-bottom: 6px;
      }
      .auth-field input,
      .auth-field select,
      .log-date-input {
        width: 100%;
        padding: 10px 12px;
        border: 1px solid var(--line);
        border-radius: 9px;
        background: var(--bg);
        font-size: 14px;
        appearance: none;
        -webkit-appearance: none;
        -moz-appearance: none;
      }
      .auth-field input:focus,
      .auth-field select:focus,
      .log-date-input:focus {
        outline: 2px solid var(--green);
        outline-offset: 1px;
      }
      .auth-field select {
        background-image: url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 10 6'><path fill='%236E7A6A' d='M0 0l5 6 5-6z'/></svg>");
        background-repeat: no-repeat;
        background-position: right 12px center;
        background-size: 10px 6px;
      }
      .log-date-input {
        max-width: 190px;
      }
      .auth-submit {
        width: 100%;
        margin-top: 6px;
      }
      .auth-message {
        font-size: 12px;
        margin-top: 12px;
        min-height: 16px;
      }
      .auth-message.error {
        color: var(--red);
      }
      .auth-message.ok {
        color: var(--green);
      }
      .auth-note {
        font-size: 11px;
        color: var(--ink-muted);
        margin-top: 16px;
        line-height: 1.5;
      }

      /* ---------- Loading / footer ---------- */
      .loading-state {
        text-align: center;
        padding: 80px 0;
        color: var(--ink-muted);
        font-size: 14px;
      }

      .home {
        display: flex;
        flex-direction: column;
        gap: 16px;
      }
      .home-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
      }
      .home-header .eyebrow {
        margin: 0 0 3px;
      }
      .home-header .subtitle {
        margin: 0;
      }
      .header-actions {
        display: flex;
        gap: 10px;
        align-items: center;
      }
      .icon-btn {
        width: 38px;
        height: 38px;
        border-radius: 50%;
        background: var(--surface);
        border: 1px solid var(--line);
        color: var(--ink);
        font-size: 17px;
        display: flex;
        align-items: center;
        justify-content: center;
        transition:
          background 0.15s ease,
          border-color 0.15s ease;
      }
      .icon-btn:hover {
        background: var(--surface-alt);
        border-color: rgba(28, 42, 31, 0.12);
      }
      .header-username {
        font-size: 13px;
        color: var(--ink-muted);
        padding: 8px 12px;
        border-radius: 999px;
        border: 1px solid var(--line);
        background: var(--surface);
      }
      .today-card {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 20px;
        padding: 18px;
      }
      .today-top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
      }
      .today-date-row {
        display: flex;
        align-items: center;
        gap: 5px;
      }
      .today-date {
        font-family: "Fraunces", serif;
        font-size: 22px;
        font-weight: 600;
        margin-bottom: 0;
        text-align: left;
      }
      .today-date small {
        display: block;
        font-family: "Inter", sans-serif;
        font-size: 11px;
        font-weight: 500;
        color: var(--ink-muted);
        margin-top: 3px;
      }
      .date-picker-trigger {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        padding: 0 4px;
        background: transparent;
        color: var(--ink);
      }
      .date-picker-trigger:hover .today-date {
        color: var(--green);
      }
      .date-picker-icon {
        width: 16px;
        height: 16px;
        color: var(--ink-muted);
        flex: none;
      }
      .date-picker-input {
        position: absolute;
        width: 1px;
        height: 1px;
        opacity: 0;
        pointer-events: none;
      }
      .today-kcal {
        font-family: "IBM Plex Mono", monospace;
        color: var(--ink);
        text-align: right;
        white-space: nowrap;
      }
      .today-kcal strong {
        display: block;
        font-size: 20px;
      }
      .today-kcal .goal-kcal {
        color: var(--ink-muted);
        font-family: inherit;
        font-size: inherit;
        font-weight: inherit;
      }
      .today-metrics {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        gap: 8px;
        margin-top: 16px;
      }
      .metric {
        background: var(--bg);
        border-radius: 12px;
        padding: 10px 8px;
        text-align: center;
      }
      .metric .value {
        font-family: "IBM Plex Mono", monospace;
        font-size: 15px;
        font-weight: 600;
      }
      .metric .label {
        font-size: 9px;
        text-transform: uppercase;
        letter-spacing: 0.07em;
        color: var(--ink-muted);
        margin-top: 3px;
      }
      .metric.deficit .value {
        color: var(--green);
      }
      .metric.surplus .value {
        color: var(--red);
      }
      .today-chips {
        margin-top: 16px;
        display: grid;
        gap: 12px;
      }
      .chip-group {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .chip-group-header {
        font-size: 10px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.14em;
        color: var(--ink-muted);
      }
      .chip-list {
        display: flex;
        flex-wrap: wrap;
        gap: 7px;
      }
      .today-chip {
        border: 1px solid var(--line);
        background: var(--surface);
        color: var(--ink);
        border-radius: 999px;
        display: inline-flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 30px;
        padding: 2px 10px;
        font-size: 11px;
        cursor: pointer;
        transition:
          background 0.15s ease,
          border-color 0.15s ease,
          color 0.15s ease;
        white-space: nowrap;
      }
      .today-chip.active {

  <body>
    <div class="app-shell" id="app">
      <div class="loading-state" id="loading">Loading your pantry…</div>
    </div>

    <div class="backdrop" id="drawerBackdrop"></div>
    <div class="drawer" id="drawer"></div>

    <div class="modal-backdrop" id="ingModalBackdrop">
      <div class="modal" id="ingModal"></div>
    </div>

    <div class="modal-backdrop" id="transferModalBackdrop">
      <div class="modal" id="transferModal"></div>

    <div class="modal-backdrop" id="historyModalBackdrop">
      <div class="modal" id="historyModal"></div>
    </div>

    <div class="modal-backdrop" id="confirmModalBackdrop">
      <div class="modal confirm-modal" id="confirmModal">
        <h2 id="confirmTitle">Confirm</h2>
        <div class="subtitle" id="confirmMessage">Are you sure?</div>
        <div class="modal-footer" id="confirmFooter">
          <button class="btn btn-secondary" id="confirmCancelBtn">
            Cancel
          </button>
          <button class="btn btn-danger-outline" id="confirmOkBtn">
            Delete
          </button>
        </div>

    <script>
      /* ===================== Data ===================== */
      const DEFAULT_MAINTENANCE = 2200;

      let ingredients = [];
      let meals = [];
      let snacks = [];
      let logs = {}; // dateStr (YYYY-MM-DD) -> log entry
      let maintenanceCal = DEFAULT_MAINTENANCE;
      let openMealId = null;
      let ingModalOpen = false;
      let ingModalView = "list";
      let ingEditorId = null;
      let ingEditorReturnTo = "ingredientsModal";
      let transferModalOpen = false;
      let historyModalOpen = false;
      let dataLoaded = false;
      let ingSearchTerm = "";
      let managerMealSearchTerm = "";
      let managerSnackSearchTerm = "";
      let managerIngredientSearchTerm = "";
      let ingDragFromId = null;
      let itemDragFromId = null;
      let logDate = todayStr();
      let foodManagerTab = "meals";

      const DEFAULT_SNACKS = [
        { id: "snack-apple", name: "Apple", kcal: 95 },
        { id: "snack-banana", name: "Banana", kcal: 105 },
        { id: "snack-orange", name: "Orange", kcal: 62 },
        { id: "snack-sardines", name: "Sardines (tin)", kcal: 220 },
      ];

      function defaultLogEntry() {
        return {
          mode: "meal",
          mealId: null,
          mealServings: 1,
          manualMealName: "",
          manualMealKcal: 0,
          snacks: [],
        };
      }

      /* ===================== SQLite backend ===================== */
      let currentUser = null;

      async function api(path, options = {}) {
        const res = await fetch(path, {
          headers: {
            "Content-Type": "application/json",
            ...(options.headers || {}),
          },
          ...options,
        });
        let body = null;
        try {
          body = await res.json();
        } catch (e) {}
        if (!res.ok)
          throw new Error(body?.error || `Request failed (${res.status})`);
        return body;
      }

      function setSaveStatus(state) {
        // Save status is no longer shown in the header.
      }

      async function loadData() {
        if (!currentUser) return;
        try {
          const result = await api("/api/data");
          const parsed = result.data || {};
          ingredients = Array.isArray(parsed.ingredients)
            ? parsed.ingredients
            : [];
          meals = Array.isArray(parsed.meals) ? parsed.meals : [];
          snacks = Array.isArray(parsed.snacks)
            ? parsed.snacks
            : DEFAULT_SNACKS.map((s) => ({ ...s }));
          logs =
            parsed.logs && typeof parsed.logs === "object" ? parsed.logs : {};
          maintenanceCal = parsed.maintenanceCal || DEFAULT_MAINTENANCE;
        } catch (e) {
          console.error("Load failed", e);
          ingredients = [];
          meals = [];
          snacks = DEFAULT_SNACKS.map((s) => ({ ...s }));
          logs = {};
          maintenanceCal = DEFAULT_MAINTENANCE;
        }
        dataLoaded = true;
        renderApp();
      }

      async function saveData() {
        if (!dataLoaded || !currentUser) return;
        setSaveStatus("saving");
        try {
          await api("/api/data", {
            method: "PUT",
            body: JSON.stringify({
              ingredients,
              meals,
              snacks,
              logs,
              maintenanceCal,
            }),
          });
          setSaveStatus("ok");
        } catch (e) {
          console.error("Save failed", e);
          setSaveStatus("error");
        }
      }

      function showAuth(message = "", isError = false) {
        document.getElementById("app").innerHTML =
          `<div class="auth-shell"><div class="auth-card"><div class="eyebrow">Pantry to Plate</div><h1>Meal Builder</h1><div class="subtitle">Sign in to keep your meals, snacks and history in your SQLite database.</div><div class="auth-tabs"><button class="auth-tab active" id="loginTab">Log in</button><button class="auth-tab" id="signupTab">Sign up</button></div><form id="authForm"><div class="auth-field"><label>Username</label><input id="authUsername" type="text" autocomplete="username" required minlength="3" placeholder="Choose a username"></div><div class="auth-field"><label>Password</label><input id="authPassword" type="password" autocomplete="current-password" minlength="6" required placeholder="At least 6 characters"></div><button class="btn btn-primary auth-submit" type="submit" id="authSubmit">Log in</button></form><div class="auth-message ${isError ? "error" : "ok"}" id="authMessage">${escapeHtml(message)}</div><div class="auth-note">Your account and Meal Builder data are stored in the local SQLite database on the server.</div></div></div>`;
        let mode = "login";
        const loginTab = document.getElementById("loginTab"),
          signupTab = document.getElementById("signupTab"),
          submit = document.getElementById("authSubmit"),
          form = document.getElementById("authForm"),
          msg = document.getElementById("authMessage");
        function setMode(next) {
          mode = next;
          loginTab.classList.toggle("active", mode === "login");
          signupTab.classList.toggle("active", mode === "signup");
          submit.textContent = mode === "login" ? "Log in" : "Create account";
          document
            .getElementById("authPassword")
            .setAttribute(
              "autocomplete",
              mode === "login" ? "current-password" : "new-password",
            );
          msg.textContent = "";
          msg.className = "auth-message";
        }
        loginTab.onclick = () => setMode("login");

      async function updateMaintenance(value) {
        const v = parseFloat(value);
        maintenanceCal =
          isNaN(v) || v <= 0 ? DEFAULT_MAINTENANCE : Math.round(v);
        await saveData();
        renderApp();
      }

      /* ===================== Reordering ===================== */
      async function reorderMeals(fromIndex, toIndex) {
        if (fromIndex === toIndex || fromIndex == null || toIndex == null)
          return;
        const [moved] = meals.splice(fromIndex, 1);
        meals.splice(toIndex, 0, moved);
        await saveData();
        renderApp();
      }

      async function reorderSnacks(fromId, toId) {
        if (!fromId || !toId || fromId === toId) return;
        const fromIndex = snacks.findIndex((s) => s.id === fromId);
        const toIndex = snacks.findIndex((s) => s.id === toId);
        if (fromIndex === -1 || toIndex === -1) return;
        const [moved] = snacks.splice(fromIndex, 1);
        const adjustedTo = fromIndex < toIndex ? toIndex - 1 : toIndex;
        snacks.splice(adjustedTo, 0, moved);
        await saveData();
        renderApp();
      }

      async function reorderIngredients(fromId, toId) {
        if (!fromId || !toId || fromId === toId) return;
        const fromIndex = ingredients.findIndex((i) => i.id === fromId);
        const toIndex = ingredients.findIndex((i) => i.id === toId);
        if (fromIndex === -1 || toIndex === -1) return;
        const [moved] = ingredients.splice(fromIndex, 1);
        ingredients.splice(toIndex, 0, moved);
        await saveData();
        renderApp();
        renderIngredientsModal();
        if (openMealId) renderDrawer();
      }

      async function reorderMealItems(mealId, fromId, toId) {
        if (!fromId || !toId || fromId === toId) return;
        const meal = meals.find((m) => m.id === mealId);
        if (!meal) return;
        const fromIndex = meal.items.findIndex(
          (it) => it.ingredientId === fromId,
        );
        const toIndex = meal.items.findIndex((it) => it.ingredientId === toId);
        if (fromIndex === -1 || toIndex === -1) return;
        const [moved] = meal.items.splice(fromIndex, 1);
        meal.items.splice(toIndex, 0, moved);
        await saveData();
        renderDrawer();
      }

      /* ===================== Helpers ===================== */
      function uid(prefix) {
        return prefix + "-" + Math.random().toString(36).slice(2, 9);
      }

      /* ---- Date helpers (all local-time, avoid UTC shift) ---- */
      function formatDateISO(d) {
        const y = d.getFullYear();
        const m = String(d.getMonth() + 1).padStart(2, "0");
        const day = String(d.getDate()).padStart(2, "0");
        return `${y}-${m}-${day}`;
      }
      function todayStr() {
        return formatDateISO(new Date());
      }
      function parseISODate(ds) {
        const [y, m, d] = ds.split("-").map(Number);
        return new Date(y, m - 1, d);
      }
      function shiftDateStr(ds, days) {
        const d = parseISODate(ds);
        d.setDate(d.getDate() + days);
        return formatDateISO(d);
      }
      function prettyDate(ds) {
        const d = parseISODate(ds);
        return d.toLocaleDateString(undefined, {
          weekday: "short",
          day: "numeric",
          month: "short",
          year: "numeric",
        });
      }
      function shortDate(ds) {
        const d = parseISODate(ds);
        return d.toLocaleDateString(undefined, {
          day: "numeric",
          month: "short",
        });
      }

      function getIngredient(id) {
        return ingredients.find((i) => i.id === id);
      }

      function itemKcal(item) {
        const ing = getIngredient(item.ingredientId);
        if (!ing) return 0;
        return ing.unit === "g"
          ? (item.amount / 100) * ing.kcal
          : item.amount * ing.kcal;
      }

      function mealKcal(meal) {
        return Math.round(
          meal.items.reduce((sum, it) => sum + itemKcal(it), 0),
        );
      }

      function kcalColor(kcal) {
        const cap = maintenanceCal > 0 ? maintenanceCal : 1800;
        const pct = cap > 0 ? kcal / cap : 0;
        if (pct < 0.5)
          return { solid: "var(--green)", soft: "var(--green-soft)" };
        if (pct < 0.6)
          return { solid: "var(--orange)", soft: "var(--orange-soft)" };
        return { solid: "var(--red)", soft: "var(--red-soft)" };
      }

      function historyHeatColor(deficit, max) {
        if (!Number.isFinite(deficit) || max <= 0) return "var(--surface-alt)";
        const intensity = Math.min(1, Math.abs(deficit) / max);
        const greenShades = [
          "#edf6ec",
          "#d7ebd7",
          "#bde1bc",
          "#8fcf8d",
          "#5c9f5b",
        ];
        const redShades = [
          "#f9e5e1",
          "#f3c7be",
          "#eb9b8f",
          "#e16661",
          "#b63d38",
        ];
        const idx = Math.min(
          greenShades.length - 1,
          Math.floor(intensity * greenShades.length),
        );
        return deficit >= 0 ? greenShades[idx] : redShades[idx];
      }

      function dialHTML(kcal, big) {
        const cap = maintenanceCal > 0 ? maintenanceCal : 1800;
        const pct = Math.max(0, Math.min(1, kcal / cap));
        const deg = Math.round(pct * 360);
        const c = kcalColor(kcal);
        const cls = big ? "dial drawer-dial" : "dial";
        return `<div class="${cls}" style="background:conic-gradient(${c.solid} ${deg}deg, var(--surface-alt) ${deg}deg)">
    <div class="dial-inner">
      <div class="dial-kcal" style="color:${c.solid}">${kcal.toLocaleString()}</div>
      <div class="dial-kcal-label">kcal</div>
    </div>
  </div>`;
      }

      function escapeHtml(s) {
        return String(s).replace(
          /[&<>"']/g,
          (m) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[m],
        );
      }

      /* ===================== Meal CRUD ===================== */
      async function addMeal() {
        const meal = { id: uid("meal"), name: "New meal", items: [] };
        meals.push(meal);
        await saveData();
        renderApp();
        openMealEditor(meal.id);
      }

      async function copyMeal(id) {
        const original = meals.find((m) => m.id === id);
        if (!original) return;
        const idx = meals.findIndex((m) => m.id === id);
        const copy = {
          id: uid("meal"),
          name: original.name + " (copy)",
          items: original.items.map((it) => ({
            ingredientId: it.ingredientId,
            amount: it.amount,
          })),
        };
        meals.splice(idx + 1, 0, copy);
        await saveData();
        renderApp();
        openMealEditor(copy.id);
      }

      async function openMealEditor(editId) {
        let meal = meals.find((m) => m.id === editId);
        const isNew = !meal;
        if (!meal) {
          meal = { id: uid("meal"), name: "New meal", items: [] };
          meals.push(meal);
          await saveData();
          renderApp();
        }
        transferModalOpen = true;
        const modal = document.getElementById("transferModal");
        const kcal = mealKcal(meal);
        const usedIds = new Set(meal.items.map((it) => it.ingredientId));
        const available = ingredients.filter((i) => !usedIds.has(i.id));
        const rows = meal.items
          .map((it) => {
            const ing = getIngredient(it.ingredientId);
            if (!ing) return "";
            return `
      <div class="item-row">
        <div></div>
        <div class="item-name">${escapeHtml(ing.name)}</div>
        <input class="item-qty" type="number" step="any" min="0" value="${it.amount}"
          data-amount-for="${ing.id}" />
        <div class="item-unit">${ing.unit === "g" ? "g" : ""}</div>
        <div class="item-kcal mono">${Math.round(itemKcal(it))}</div>
        <button class="item-remove" data-remove="${ing.id}" aria-label="Remove ${escapeHtml(ing.name)}">×</button>
      </div>`;
          })
          .join("");

        modal.innerHTML = `
    <button class="drawer-close" id="mealEditorClose" aria-label="Close" style="position:absolute;top:18px;right:18px;">×</button>
    <h2>${isNew ? "New meal" : "Edit meal"}</h2>
    <div class="subtitle">Add ingredients and adjust the calories for this meal.</div>
    <div class="auth-field"><label>Name</label><input id="editMealName" value="${escapeHtml(meal.name)}"></div>
    <div class="section-label">Calories</div>
    <div class="subtitle" style="margin-top:0;">${kcal.toLocaleString()} kcal total</div>
    <div class="section-label">Ingredients</div>
    ${meal.items.length ? `<div class="item-head"><span></span><span>Name</span><span>Qty</span><span></span><span>Kcal</span><span></span></div>${rows}` : '<div class="empty-note">No ingredients yet — add one below.</div>'}
    <div class="add-item-row" style="margin-top:16px;">
      <select class="add-item-select" id="mealAddIngredientSelect">
        <option value="">Add an ingredient…</option>
        ${available.map((i) => `<option value="${i.id}">${escapeHtml(i.name)} (${i.unit === "g" ? "g" : "each"})</option>`).join("")}
      </select>
      <input class="add-item-qty" type="number" step="any" min="0" placeholder="qty" id="mealAddIngredientQty" />
      <button class="btn btn-primary" id="mealAddIngredientBtn">Add</button>
    </div>
    <button class="btn btn-primary primary-wide" id="saveMealBtn" style="margin-top:8px;">${isNew ? "Create meal" : "Save meal"}</button>
    ${!isNew ? '<button class="btn btn-secondary primary-wide" id="deleteMealBtn" style="margin-top:8px;">Delete meal</button>' : ""}
  `;

        document.getElementById("transferModalBackdrop").classList.add("open");
        document.getElementById("mealEditorClose").onclick = async () => {
          if (isNew && meal.items.length === 0) {
            meals = meals.filter((m) => m.id !== meal.id);
            await saveData();
            renderApp();
          }
          openFoodManager("meals");
        };
        document
          .getElementById("editMealName")
          .addEventListener("change", (e) => {
            meal.name = e.target.value.trim() || "Untitled meal";
            saveData().then(() => renderApp());
          });
        document
          .getElementById("mealAddIngredientBtn")
          .addEventListener("click", async () => {
            const sel = document.getElementById("mealAddIngredientSelect");
            const qty = parseFloat(
              document.getElementById("mealAddIngredientQty").value,
            );
            await addItemToMeal(meal.id, sel.value, qty);
            openMealEditor(meal.id);
          });
        modal.querySelectorAll("[data-amount-for]").forEach((inp) => {
          inp.addEventListener("change", async (e) => {
            await updateItemAmount(
              meal.id,
              e.target.getAttribute("data-amount-for"),
              parseFloat(e.target.value),
            );
            openMealEditor(meal.id);
          });
        });
        modal.querySelectorAll("[data-remove]").forEach((btn) => {
          btn.addEventListener("click", async (e) => {
            await removeItem(meal.id, e.target.getAttribute("data-remove"));
            openMealEditor(meal.id);
          });
        });
        document
          .getElementById("saveMealBtn")
          .addEventListener("click", async () => {
            await saveData();
            renderApp();
            openFoodManager("meals");
          });
        const deleteBtn = modal.querySelector("#deleteMealBtn");
        if (deleteBtn)
          deleteBtn.addEventListener("click", async () => {
            showConfirmModal({
              title: "Delete meal",
              message: "Delete this meal?",
              okLabel: "Delete meal",
              onConfirm: async () => {
                meals = meals.filter((m) => m.id !== meal.id);
                await saveData();
                renderApp();
                openFoodManager("meals");
              },
            });
          });
      }

      async function deleteMeal(id) {
        showConfirmModal({
          title: "Delete meal",
          message: "Delete this meal?",
          okLabel: "Delete meal",
          onConfirm: async () => {
            meals = meals.filter((m) => m.id !== id);
            await saveData();
            closeDrawer();
            renderApp();
          },
        });
      }

      async function renameMeal(id, name) {
        const meal = meals.find((m) => m.id === id);
        if (meal) {
          meal.name = name || "Untitled meal";
          await saveData();
          renderApp();
        }
      }

      async function updateItemAmount(mealId, ingredientId, amount) {
        const meal = meals.find((m) => m.id === mealId);
        const item = meal.items.find((it) => it.ingredientId === ingredientId);
        if (item) {
          item.amount = isNaN(amount) ? 0 : amount;
          await saveData();
          renderApp();
          renderDrawer();
        }
      }

      async function removeItem(mealId, ingredientId) {
        const meal = meals.find((m) => m.id === mealId);
        meal.items = meal.items.filter(
          (it) => it.ingredientId !== ingredientId,
        );
        await saveData();
        renderApp();
        renderDrawer();
      }

      async function addItemToMeal(mealId, ingredientId, amount) {
        if (!ingredientId) return;
        const meal = meals.find((m) => m.id === mealId);
        if (meal.items.some((it) => it.ingredientId === ingredientId)) return;
        meal.items.push({
          ingredientId,
          amount: isNaN(amount) || amount <= 0 ? 1 : amount,
        });
        await saveData();
        renderApp();
        renderDrawer();
      }

      /* ===================== Render: drawer ===================== */
      function openDrawer(mealId) {
        openMealId = mealId;
        renderDrawer();
        document.getElementById("drawer").classList.add("open");
        document.getElementById("drawerBackdrop").classList.add("open");
      }

      function closeDrawer() {
        document.getElementById("drawer").classList.remove("open");
        document.getElementById("drawerBackdrop").classList.remove("open");
        openMealId = null;
      }

      function renderDrawer() {
        const drawer = document.getElementById("drawer");
        if (!openMealId) {
          drawer.innerHTML = "";
          return;
        }
        const meal = meals.find((m) => m.id === openMealId);
        if (!meal) {
          closeDrawer();
          return;
        }

        const kcal = mealKcal(meal);
        const usedIds = new Set(meal.items.map((it) => it.ingredientId));
        const available = ingredients.filter((i) => !usedIds.has(i.id));

        const rows = meal.items
          .map((it) => {
            const ing = getIngredient(it.ingredientId);
            if (!ing) return "";
            return `
      <div class="item-row" draggable="false" data-item-id="${ing.id}">
        <div class="item-drag" data-item-drag title="Drag to reorder">⠿</div>
        <div class="item-name">${escapeHtml(ing.name)}</div>
        <input class="item-qty" type="number" step="any" min="0" value="${it.amount}"
          data-amount-for="${ing.id}" />
        <div class="item-unit">${ing.unit === "g" ? "g" : ""}</div>
        <div class="item-kcal mono">${Math.round(itemKcal(it))}</div>
        <button class="item-remove" data-remove="${ing.id}" aria-label="Remove ${escapeHtml(ing.name)}">×</button>
      </div>`;
          })
          .join("");

        drawer.innerHTML = `
    <div class="drawer-topbar"><span class="drawer-kicker">MEAL</span><button class="drawer-close" id="drawerCloseBtn" aria-label="Close">×</button></div>
    <input class="meal-name-input" id="mealNameInput" value="${escapeHtml(meal.name)}" />

    <div class="drawer-dial-wrap">${dialHTML(kcal, true)}</div>

    ${meal.items.length ? `<div class="item-head"><span></span><span>Name</span><span>Qty</span><span></span><span>Kcal</span><span></span></div>${rows}` : '<div class="empty-note">No ingredients yet — add one below.</div>'}

    <div class="add-item-row">
      <select class="add-item-select" id="addItemSelect">
        <option value="">Add an ingredient…</option>
        ${available.map((i) => `<option value="${i.id}">${escapeHtml(i.name)} (${i.unit === "g" ? "g" : "each"})</option>`).join("")}
      </select>
      <input class="add-item-qty" type="number" step="any" min="0" placeholder="qty" id="addItemQty" />
      <button class="btn btn-primary" id="addItemBtn">Add</button>
    </div>

    <div class="drawer-footer">
      <button class="btn btn-danger" id="deleteMealBtn">Delete meal</button>
    </div>
  `;

        document
          .getElementById("drawerCloseBtn")
          .addEventListener("click", closeDrawer);
        document
          .getElementById("mealNameInput")
          .addEventListener("change", (e) =>
            renameMeal(meal.id, e.target.value.trim()),
          );
        document
          .getElementById("deleteMealBtn")
          .addEventListener("click", () => deleteMeal(meal.id));
        document.getElementById("addItemBtn").addEventListener("click", () => {
          const sel = document.getElementById("addItemSelect");
          const qty = parseFloat(document.getElementById("addItemQty").value);
          addItemToMeal(meal.id, sel.value, qty);
        });
        drawer.querySelectorAll("[data-amount-for]").forEach((inp) => {
          inp.addEventListener("change", (e) =>
            updateItemAmount(
              meal.id,
              e.target.getAttribute("data-amount-for"),
              parseFloat(e.target.value),
            ),
          );
        });
        drawer.querySelectorAll("[data-remove]").forEach((btn) => {
          btn.addEventListener("click", (e) =>
            removeItem(meal.id, e.target.getAttribute("data-remove")),
          );
        });
        drawer.querySelectorAll(".item-row").forEach((row) => {
          const handle = row.querySelector("[data-item-drag]");
          if (handle) {
            handle.addEventListener("mousedown", () =>
              row.setAttribute("draggable", "true"),
            );
            handle.addEventListener(
              "touchstart",
              () => row.setAttribute("draggable", "true"),
              { passive: true },
            );
          }
          row.addEventListener("dragstart", (e) => {
            itemDragFromId = row.getAttribute("data-item-id");
            row.classList.add("dragging");
            e.dataTransfer.effectAllowed = "move";
          });
          row.addEventListener("dragend", () => {
            row.classList.remove("dragging");
            row.setAttribute("draggable", "false");
            drawer
              .querySelectorAll(".item-row")
              .forEach((r) => r.classList.remove("drag-over"));
            setTimeout(() => {
              itemDragFromId = null;
            }, 0);
          });
          row.addEventListener("dragover", (e) => {
            e.preventDefault();
            e.dataTransfer.dropEffect = "move";
            row.classList.add("drag-over");
          });
          row.addEventListener("dragleave", () =>
            row.classList.remove("drag-over"),
          );
          row.addEventListener("drop", (e) => {
            e.preventDefault();
            row.classList.remove("drag-over");
            reorderMealItems(
              meal.id,
              itemDragFromId,
              row.getAttribute("data-item-id"),
            );
          });
        });
      }

      document
        .getElementById("drawerBackdrop")
        .addEventListener("click", closeDrawer);

      /* ===================== Ingredients modal ===================== */
      function openIngredientsModal() {
        ingModalOpen = true;
        ingModalView = "list";
        ingEditorId = null;
        ingEditorReturnTo = "ingredientsModal";
        ingModalView = "list";
        ingEditorId = null;
        ingEditorReturnTo = "ingredientsModal";
        ingSearchTerm = "";
        const modal = document.getElementById("ingModal");
        modal.innerHTML = "";
        renderIngredientsModal();
        document.getElementById("ingModalBackdrop").classList.add("open");
      }
      function closeIngredientsModal() {
        ingModalOpen = false;
        document.getElementById("ingModalBackdrop").classList.remove("open");
      }

      async function deleteIngredient(id, returnTo = "ingredientsModal") {
        const usedIn = meals.filter((m) =>
          m.items.some((it) => it.ingredientId === id),
        );
        if (usedIn.length) {
          showConfirmModal({
            title: "Unable to delete",
            message: `This ingredient is used in: ${usedIn.map((m) => m.name).join(", ")}. Remove it from those meals first.`,
            okLabel: "Okay",
            onConfirm: async () => {},
          });
          return;
        }
        showConfirmModal({
          title: "Delete ingredient",
          message: "Delete this ingredient?",
          okLabel: "Delete ingredient",
          onConfirm: async () => {
            ingredients = ingredients.filter((i) => i.id !== id);
            await saveData();
            renderApp();
            if (openMealId) renderDrawer();
            if (returnTo === "foodManager") {
              closeIngredientsModal();
              openFoodManager("ingredients");
            } else {
              renderIngredientsModal();
            }
          },
        });
      }

      async function addIngredient(name, unit, kcal, skipRender = false) {
        if (!name || !name.trim()) return;
        ingredients.push({
          id: uid("ing"),
          name: name.trim(),
          unit: unit || "g",
          kcal: isNaN(kcal) ? 0 : kcal,
        });
        await saveData();
        renderApp();
        if (openMealId) renderDrawer();
        if (!skipRender) renderIngredientsModal();
      }

      function openIngredientEditor(editId, returnTo = "ingredientsModal") {
        ingModalOpen = true;
        ingModalView = "editor";
        ingEditorId = editId || null;
        ingEditorReturnTo = returnTo;
        renderIngredientsModal();
        document.getElementById("ingModalBackdrop").classList.add("open");
      }

      function renderIngredientsModal() {
        const modal = document.getElementById("ingModal");
        if (!ingModalOpen) {
          modal.innerHTML = "";
          return;
        }

        if (ingModalView === "editor") {
          const ingredient = ingredients.find((i) => i.id === ingEditorId) || {
            name: "",
            unit: "g",
            kcal: 0,
          };
          modal.innerHTML = `
      <button class="drawer-close" id="ingModalCloseBtn" aria-label="Close">×</button>
      <h2>${ingredient.id ? "Edit ingredient" : "New ingredient"}</h2>
      <div class="subtitle">${ingredient.id ? "Update a saved ingredient." : "Add a new ingredient to your pantry."}</div>
      <div class="auth-field"><label>Name</label><input id="editIngName" value="${escapeHtml(ingredient.name)}" placeholder="e.g. Chicken breast"></div>
      <div class="auth-field"><label>Unit</label><select id="editIngUnit"><option value="g" ${ingredient.unit === "g" ? "selected" : ""}>g</option><option value="each" ${ingredient.unit === "each" ? "selected" : ""}>each</option></select></div>
      <div class="auth-field"><label>Calories</label><input id="editIngKcal" type="number" min="0" step="any" value="${ingredient.kcal || ""}" placeholder="kcal"></div>
      <button class="btn btn-primary primary-wide" id="saveIngredientBtn">${ingredient.id ? "Save ingredient" : "Add ingredient"}</button>
      ${ingredient.id ? '<button class="btn btn-secondary primary-wide" id="deleteIngredientBtn" style="margin-top:8px;">Delete ingredient</button>' : ""}
    `;

          const closeButton = document.getElementById("ingModalCloseBtn");
          if (closeButton) {
            closeButton.addEventListener("click", () => {
              if (ingEditorReturnTo === "foodManager") {
                closeIngredientsModal();
                openFoodManager("ingredients");
              } else {
                openIngredientsModal();
              }
            });
          }

          document
            .getElementById("saveIngredientBtn")
            .addEventListener("click", async () => {
              const name = document.getElementById("editIngName").value.trim();
              const unit = document.getElementById("editIngUnit").value;
              const kcal = parseFloat(
                document.getElementById("editIngKcal").value,
              );
              if (!name || !Number.isFinite(kcal) || kcal < 0) return;
              if (ingredient.id) {
                ingredient.name = name;
                ingredient.unit = unit;
                ingredient.kcal = kcal;
                await saveData();
                renderApp();
                if (openMealId) renderDrawer();
                if (ingEditorReturnTo === "foodManager") {
                  closeIngredientsModal();
                  openFoodManager("ingredients");
                } else {
                  openIngredientsModal();
                }
              } else {
                await addIngredient(
                  name,
                  unit,
                  kcal,
                  ingEditorReturnTo === "foodManager",
                );
                if (ingEditorReturnTo === "foodManager") {
                  closeIngredientsModal();
                  openFoodManager("ingredients");
                } else {
                  openIngredientsModal();
                }
              }
            });

          if (ingredient.id) {
            document
              .getElementById("deleteIngredientBtn")
              .addEventListener("click", async () => {
                await deleteIngredient(ingredient.id, ingEditorReturnTo);
              });
          }
          return;
        }

        const term = ingSearchTerm.trim().toLowerCase();
        const filtered = term
          ? ingredients.filter((i) => i.name.toLowerCase().includes(term))
          : ingredients;

        modal.innerHTML = `
    <button class="drawer-close" id="ingModalCloseBtn" aria-label="Close" style="position:absolute;top:18px;right:18px;">×</button>
    <h2>Ingredients</h2>
    <div class="subtitle">Calories per 100g for weighed items, or per item for things you count.</div>
    <input class="ing-search" id="ingSearchInput" type="search" placeholder="Search ingredients…" value="${escapeHtml(ingSearchTerm)}" />
    ${term ? `<div class="ing-search-note">${filtered.length} of ${ingredients.length} shown.</div>` : ""}
    <div class="manager-list">${
      filtered.length
        ? filtered
            .map(
              (i) =>
                `<button class="manager-item" data-manager-ingredient="${i.id}"><span><strong>${escapeHtml(i.name)}</strong><small>${i.kcal} kcal ${i.unit === "g" ? "/ 100g" : "/ item"}</small></span><span>›</span></button>`,
            )
            .join("")
        : '<div class="empty-note">No ingredients match that search.</div>'
    }
    </div>
    <div class="section-label">Add new</div>
    <button class="btn btn-primary primary-wide" id="addIngBtn">＋ New ingredient</button>
    <div class="modal-footer">
      <span class="subtitle" style="margin:0;">${ingredients.length} ingredients on file</span>
      <button class="btn btn-secondary" id="ingDoneBtn">Done</button>
    </div>
  `;

        const closeButton = document.getElementById("ingModalCloseBtn");
        if (closeButton) {
          closeButton.addEventListener("click", closeIngredientsModal);
        }
        const doneButton = document.getElementById("ingDoneBtn");
        if (doneButton) {
          doneButton.addEventListener("click", closeIngredientsModal);
        }
        const searchInput = document.getElementById("ingSearchInput");
        if (searchInput) {
          searchInput.addEventListener("input", (e) => {
            ingSearchTerm = e.target.value;
            renderIngredientsModal();
            const el = document.getElementById("ingSearchInput");
            if (el) {
              el.focus();
              el.selectionStart = el.selectionEnd = el.value.length;
            }
          });
        }
        const addBtn = document.getElementById("addIngBtn");
        if (addBtn) {
          addBtn.addEventListener("click", () => openIngredientEditor());
        }
        document
          .querySelectorAll("[data-manager-ingredient]")
          .forEach((btn) => {
            btn.addEventListener("click", (e) =>
              openIngredientEditor(e.currentTarget.dataset.managerIngredient),
            );
          });
      }

      document
        .getElementById("ingModalBackdrop")
        .addEventListener("click", (e) => {
          if (e.target.id === "ingModalBackdrop") closeIngredientsModal();
        });

      /* ===================== Snacks tab ===================== */
      async function addSnack(name, kcal) {
        if (!name || !name.trim()) return;
        snacks.push({
          id: uid("snack"),
          name: name.trim(),
          kcal: isNaN(kcal) ? 0 : kcal,
        });
        await saveData();
        renderApp();
      }

      async function updateSnackField(id, field, value) {
        const snack = snacks.find((s) => s.id === id);
        if (!snack) return;
        if (field === "name") snack.name = value || snack.name;
        if (field === "kcal") snack.kcal = isNaN(value) ? snack.kcal : value;
        await saveData();
        renderApp();
      }

      async function deleteSnack(id) {
        showConfirmModal({
          title: "Delete snack",
          message:
            "Delete this snack? It will be removed from any past logged days too.",
          okLabel: "Delete snack",
          onConfirm: async () => {
            snacks = snacks.filter((s) => s.id !== id);
            Object.values(logs).forEach((log) => {
              log.snacks = log.snacks.filter((e) => e.snackId !== id);
            });
            await saveData();
            renderApp();
          },
        });
      }

      /* ===================== Daily log: data + compute ===================== */
      function getLog(dateStr) {
        return logs[dateStr] || defaultLogEntry();
      }
      function ensureLog(dateStr) {
        if (!logs[dateStr]) logs[dateStr] = defaultLogEntry();
        return logs[dateStr];
      }

      function logMealKcal(log) {
        if (log.mode === "custom") return Math.round(log.manualMealKcal || 0);
        const meal = meals.find((m) => m.id === log.mealId);
        if (!meal) return 0;
        return Math.round(mealKcal(meal) * (log.mealServings || 1));
      }
      function logSnacksKcal(log) {
        return Math.round(
          (log.snacks || []).reduce((sum, e) => {
            const snack = snacks.find((s) => s.id === e.snackId);
            return sum + (snack ? snack.kcal * e.qty : 0);
          }, 0),
        );
      }
      function logTotalKcal(log) {
        return logMealKcal(log) + logSnacksKcal(log);
      }
      function logDeficit(log) {
        return maintenanceCal - logTotalKcal(log);
      }
      function logHasEntries(log) {
        return (
          (!!log &&
            (log.mode === "custom"
              ? log.manualMealKcal > 0 || !!log.manualMealName
              : !!log.mealId)) ||
          (log && log.snacks && log.snacks.length > 0)
        );
      }

      /* ===================== Daily log: mutators ===================== */
      function refreshLog() {
        renderApp();
      }
      async function setLogMode(dateStr, mode) {
        const log = ensureLog(dateStr);
        log.mode = mode;
        await saveData();
        refreshLog();
      }
      async function setLogMeal(dateStr, mealId) {
        const log = ensureLog(dateStr);
        log.mealId = mealId || null;
        await saveData();
        refreshLog();
      }
      async function setLogMealServings(dateStr, servings) {
        const log = ensureLog(dateStr);
        log.mealServings = isNaN(servings) || servings <= 0 ? 1 : servings;
        await saveData();
        refreshLog();
      }
      async function setManualMeal(dateStr, name, kcal) {
        const log = ensureLog(dateStr);
        log.manualMealName = name;
        log.manualMealKcal = isNaN(kcal) ? 0 : kcal;
        await saveData();
        refreshLog();
      }
      async function addLogSnack(dateStr, snackId, qty) {
        if (!snackId) return;
        const log = ensureLog(dateStr);
        const q = isNaN(qty) || qty <= 0 ? 1 : qty;
        const existing = log.snacks.find((e) => e.snackId === snackId);
        if (existing) existing.qty += q;
        else log.snacks.push({ snackId, qty: q });
        await saveData();
        refreshLog();
      }
      async function updateLogSnackQty(dateStr, snackId, qty) {
        const log = ensureLog(dateStr);
        const entry = log.snacks.find((e) => e.snackId === snackId);
        if (entry) {
          entry.qty = isNaN(qty) || qty <= 0 ? entry.qty : qty;
          await saveData();
          refreshLog();
        }
      }
      async function removeLogSnack(dateStr, snackId) {
        const log = ensureLog(dateStr);
        log.snacks = log.snacks.filter((e) => e.snackId !== snackId);
        await saveData();
        refreshLog();
      }
      async function clearLogDay(dateStr) {
        showConfirmModal({
          title: "Clear day",
          message: "Clear everything logged for this day?",
          okLabel: "Clear day",
          onConfirm: async () => {
            delete logs[dateStr];
            await saveData();
            refreshLog();
          },
        });
      }
      async function setLogDateView(dateStr) {
        logDate = dateStr;
        renderApp();
      }

      /* ===================== Daily log: render (main tab) ===================== */
      function computeHistory(days) {
        const arr = [];
        for (let i = days - 1; i >= 0; i--) {
          const ds = shiftDateStr(todayStr(), -i);
          const log = logs[ds];
          const has = logHasEntries(log);
          arr.push({
            date: ds,
            total: log ? logTotalKcal(log) : 0,
            deficit: log ? logDeficit(log) : 0,
            hasLog: has,
          });
        }
        return arr;
      }

      /* ===================== Export / Import ===================== */
      function openTransferModal() {
        transferModalOpen = true;
        renderTransferModal();
        document.getElementById("transferModalBackdrop").classList.add("open");
      }
      function closeTransferModal() {
        transferModalOpen = false;
        document
          .getElementById("transferModalBackdrop")
          .classList.remove("open");
      }

      function currentExportJSON() {
        return JSON.stringify(
          { ingredients, meals, snacks, logs, maintenanceCal },
          null,
          2,
        );
      }

      function downloadExport() {
        const blob = new Blob([currentExportJSON()], {
          type: "application/json",
        });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = "meal-builder-export.json";
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      }

      async function importFromText(text, msgEl) {
        try {
          const parsed = JSON.parse(text);
          if (
            !Array.isArray(parsed.ingredients) ||
            !Array.isArray(parsed.meals)
          ) {
            throw new Error("File is missing an ingredients or meals list.");
          }
          ingredients = parsed.ingredients;
          meals = parsed.meals;
          snacks = Array.isArray(parsed.snacks) ? parsed.snacks : [];
          logs =
            parsed.logs && typeof parsed.logs === "object" ? parsed.logs : {};
          maintenanceCal = parsed.maintenanceCal || DEFAULT_MAINTENANCE;
          await saveData();
          renderApp();
          if (msgEl) {
            msgEl.textContent = `Imported ${meals.length} meals, ${ingredients.length} ingredients and ${snacks.length} snacks.`;
            msgEl.className = "import-msg ok";
          }
        } catch (e) {
          console.error(e);
          if (msgEl) {
            msgEl.textContent =
              "Could not import that file — check it's a Meal Builder export.";
            msgEl.className = "import-msg err";
          }
        }
      }

      function renderTransferModal() {
        const modal = document.getElementById("transferModal");
        if (!transferModalOpen) {
          modal.innerHTML = "";
          return;
        }
        modal.innerHTML = `
    <button class="drawer-close" id="transferCloseBtn" aria-label="Close" style="position:absolute;top:18px;right:18px;">×</button>
    <h2>Export &amp; import</h2>
    <div class="subtitle">Move your meals and ingredients to another device, or back them up.</div>

    <div class="section-label" style="margin-top:18px;">Export</div>
    <button class="btn btn-primary" id="downloadBtn">Download .json file</button>
    <textarea class="export-textarea" id="exportText" readonly>${escapeHtml(currentExportJSON())}</textarea>
    <div class="subtitle" style="margin-top:4px;">Or select the text above and copy it directly.</div>

    <div class="section-label">Import</div>
    <div class="import-row">
      <label class="file-label">
        Choose a .json file
        <input type="file" accept="application/json,.json" id="importFile" style="display:none;">
      </label>
      <button class="btn btn-secondary" id="importPasteBtn">Paste JSON instead</button>
    </div>
    <textarea class="export-textarea" id="importText" style="display:none;" placeholder="Paste exported JSON here"></textarea>
    <button class="btn btn-primary" id="importPasteConfirm" style="display:none;margin-top:8px;">Import pasted data</button>
    <div class="import-msg" id="importMsg"></div>

    <div class="modal-footer">
      <span class="subtitle" style="margin:0;">Importing replaces everything currently saved.</span>
      <button class="btn btn-secondary" id="transferDoneBtn">Done</button>
    </div>
  `;

        document
          .getElementById("transferCloseBtn")
          .addEventListener("click", closeTransferModal);
        document
          .getElementById("transferDoneBtn")
          .addEventListener("click", closeTransferModal);
        document
          .getElementById("downloadBtn")
          .addEventListener("click", downloadExport);

        document
          .getElementById("importFile")
          .addEventListener("change", (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = () =>
              importFromText(
                reader.result,
                document.getElementById("importMsg"),
              );
            reader.readAsText(file);
          });

        document
          .getElementById("importPasteBtn")
          .addEventListener("click", () => {
            document.getElementById("importText").style.display = "block";
            document.getElementById("importPasteConfirm").style.display =
              "inline-flex";
          });
        document
          .getElementById("importPasteConfirm")
          .addEventListener("click", () => {
            const text = document.getElementById("importText").value;
            importFromText(text, document.getElementById("importMsg"));
          });
      }

      document
        .getElementById("transferModalBackdrop")
        .addEventListener("click", (e) => {
          if (e.target.id === "transferModalBackdrop") closeTransferModal();
        });

      function openHistoryModal() {
        historyModalOpen = true;
        renderHistoryModal();
        document.getElementById("historyModalBackdrop").classList.add("open");
      }

      function closeHistoryModal() {
        historyModalOpen = false;
        document
          .getElementById("historyModalBackdrop")
          .classList.remove("open");
      }

      function renderHistoryModal() {
        const modal = document.getElementById("historyModal");
        if (!historyModalOpen) {
          modal.innerHTML = "";
          return;
        }
        // Build list of all logged days; if none, fall back to last 90 days
        let histAll = [];
        const logDates = Object.keys(logs || {}).sort();
        if (logDates.length) {
          histAll = logDates.map((ds) => {
            const log = logs[ds];
            return {
              date: ds,
              total: log ? logTotalKcal(log) : 0,
              deficit: log ? logDeficit(log) : 0,
              hasLog: logHasEntries(log),
            };
          });
        } else {
          histAll = computeHistory(90);
        }
        const maxAll = Math.max(
          100,
          ...histAll.map((h) => Math.abs(h.deficit)),
        );
        modal.innerHTML = `
    <button class="drawer-close" id="historyCloseBtn" aria-label="Close" style="position:absolute;top:18px;right:18px;">×</button>
    <h2>Full history</h2>
    <div class="subtitle">Last ${histAll.length} days</div>
    <div style="display:grid;grid-template-columns:repeat(12,1fr);gap:8px;margin-top:14px;max-height:60vh;overflow:auto;">
      ${histAll
        .map((h) => {
          const color = h.hasLog
            ? historyHeatColor(h.deficit, maxAll)
            : "var(--surface-alt)";
          const label = h.hasLog
            ? `${prettyDate(h.date)}: ${h.deficit >= 0 ? `${h.deficit} deficit` : `${Math.abs(h.deficit)} surplus`}`
            : "Not logged";
          const v = h.hasLog
            ? h.deficit >= 0
              ? `${h.deficit}`
              : `-${Math.abs(h.deficit)}`
            : "";
          return `<div style="padding:10px;border-radius:8px;background:${color};text-align:center;border:1px solid var(--line);">${v}<div style="font-size:10px;color:var(--ink-muted);margin-top:6px;">${parseISODate(h.date).toLocaleDateString()}</div></div>`;
        })
        .join("")}
    </div>
  `;
        document
          .getElementById("historyCloseBtn")
          .addEventListener("click", closeHistoryModal);
      }

      document
        .getElementById("historyModalBackdrop")
        .addEventListener("click", (e) => {
          if (e.target.id === "historyModalBackdrop") closeHistoryModal();
        });

      /* ===================== Init ===================== */
      initAuth();
    </script>
  </body>
</html>
