<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Meal Builder</title>
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍋</text></svg>"
    />
    <meta name="theme-color" content="#f3f5ee" id="themeColorMeta" />
    <script>
      (function () {
        var stored = null;
        try {
          stored = localStorage.getItem("theme");
        } catch (e) {}
        var theme =
          stored === "dark" || stored === "light"
            ? stored
            : window.matchMedia &&
                window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
        document.documentElement.setAttribute("data-theme", theme);
      })();
    </script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap");

      :root {
        --bg: #f3f5ee;
        --surface: #ffffff;
        --surface-alt: #eaefe2;
        --ink: #1c2a1f;
        --ink-muted: #6e7a6a;
        --line: #dde3d3;
        --green: #3f6b4a;
        --green-light: #6fa47c;
        --green-soft: #e4eee3;
        --orange: #dd8034;
        --orange-soft: #fbeadc;
        --red: #c1442c;
        --red-soft: #f7e1da;
        --radius: 16px;
        --shadow-rgb: 28, 42, 31;
        --backdrop-rgb: 20, 28, 20;
        --history-empty: #f0f0f0;
        --history-over: #d98970;
        --green-strong: #2f623f;
        --trend-line: #3a7dd9;
      }

      [data-theme="dark"] {
        --bg: #10150f;
        --surface: #1a201a;
        --surface-alt: #232b22;
        --ink: #eef1ea;
        --ink-muted: #93a08d;
        --line: #313b30;
        --green: #5fac6f;
        --green-light: #85c98f;
        --green-soft: #1c2b1f;
        --orange: #e39a5c;
        --orange-soft: #33261a;
        --red: #e07b64;
        --red-soft: #35201c;
        --shadow-rgb: 150, 150, 150;
        --backdrop-rgb: 0, 0, 0;
        --history-empty: #262f25;
        --history-over: #c17457;
        --green-strong: #4a8f5a;
        --trend-line: #6ea8f0;
      }

      * {
        box-sizing: border-box;
      }
      html {
        background: var(--bg);
        color-scheme: light;
      }
      html[data-theme="dark"] {
        color-scheme: dark;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family: "Inter", sans-serif;
        -webkit-font-smoothing: antialiased;
        transition:
          background 0.2s ease,
          color 0.2s ease;
      }
      h1,
      h2,
      h3 {
        font-family: "Fraunces", serif;
        margin: 0;
      }
      .mono {
        font-family: "IBM Plex Mono", monospace;
      }

      .app-shell {
        max-width: 1080px;
        margin: 0 auto;
        padding: 24px 24px 24px;
      }

      /* ---------- Header ---------- */
      header.top {
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        gap: 20px;
        flex-wrap: wrap;
        margin-bottom: 28px;
      }
      .eyebrow {
        font-family: "IBM Plex Mono", monospace;
        font-size: 11px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--green);
        margin-bottom: 6px;
      }
      h1.title {
        font-size: 34px;
        font-weight: 600;
        color: var(--ink);
      }
      .subtitle {
        color: var(--ink-muted);
        font-size: 14px;
        margin-top: 6px;
      }
      .header-actions {
        display: flex;
        gap: 10px;
        align-items: center;
      }
      .header-profile-btn {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 8px 12px;
        border-radius: 999px;
        border: 1px solid var(--line);
        background: var(--surface);
        color: var(--ink);
        transition:
          background 0.15s ease,
          border-color 0.15s ease,
          box-shadow 0.15s ease;
      }
      .header-profile-btn:hover {
        background: var(--surface-alt);
        border-color: rgba(var(--shadow-rgb), 0.12);
        box-shadow: 0 2px 8px rgba(var(--shadow-rgb), 0.06);
      }
      .header-profile-name {
        font-size: 13px;
        color: var(--ink-muted);
        line-height: 1.2;
      }
      .header-profile-icon {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-size: 15px;
        color: var(--ink);
      }

      button {
        font-family: "Inter", sans-serif;
        cursor: pointer;
        border: none;
      }
      .btn {
        padding: 10px 16px;
        border-radius: 999px;
        font-size: 13px;
        font-weight: 600;
        transition:
          transform 0.12s ease,
          box-shadow 0.12s ease;
      }
      .btn:active {
        transform: scale(0.97);
      }
      .btn-primary {
        background: var(--green);
        color: #fff;
      }
      .btn-primary:hover {
        box-shadow: 0 4px 14px rgba(63, 107, 74, 0.3);
      }
      .btn-secondary {
        background: var(--surface);
        color: var(--ink);
        border: 1px solid var(--line);
      }
      .btn-secondary:hover {
        background: var(--surface-alt);
      }
      .btn-danger {
        background: transparent;
        color: var(--red);
      }
      .btn-danger:hover {
        text-decoration: underline;
      }
      .btn-danger-outline {
        background: transparent;
        color: var(--red);
        border: 1px solid var(--red);
      }
      .btn-danger-outline:hover {
        background: rgba(193, 68, 44, 0.08);
      }

      /* ---------- Dial ---------- */
      .dial {
        width: 96px;
        height: 96px;
        border-radius: 50%;
        margin: 0 auto 14px;
        position: relative;
      }
      .dial-inner {
        position: absolute;
        inset: 9px;
        background: var(--surface);
        border-radius: 50%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }
      .dial-kcal {
        font-family: "IBM Plex Mono", monospace;
        font-weight: 600;
        font-size: 18px;
        line-height: 1;
      }
      .dial-kcal-label {
        font-size: 9px;
        color: var(--ink-muted);
        text-transform: uppercase;
        letter-spacing: 0.08em;
        margin-top: 3px;
      }

      /* ---------- Drawer ---------- */
      .backdrop {
        position: fixed;
        inset: 0;
        background: rgba(var(--backdrop-rgb), 0.7);
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.18s ease;
        z-index: 20;
      }
      .backdrop.open {
        opacity: 1;
        pointer-events: auto;
      }

      .drawer {
        position: fixed;
        top: 0;
        right: 0;
        height: 100vh;
        width: 400px;
        max-width: 92vw;
        background: var(--bg);
        box-shadow: -12px 0 30px rgba(var(--backdrop-rgb), 0.14);
        transform: translateX(100%);
        transition: transform 0.22s ease;
        z-index: 21;
        overflow-y: auto;
        padding: 26px 24px 40px;
      }
      .drawer.open {
        transform: translateX(0);
      }
      @media (prefers-reduced-motion: reduce) {
        .drawer,
        .backdrop {
          transition: none;
        }
      }

      .drawer-close {
        position: absolute;
        top: 20px;
        right: 20px;
        background: var(--surface);
        border: 1px solid var(--line);
        width: 32px;
        height: 32px;
        border-radius: 50%;
        font-size: 16px;
        color: var(--ink-muted);
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .drawer-close:hover {
        color: var(--ink);
      }

      .meal-name-input {
        font-family: "Fraunces", serif;
        font-size: 24px;
        font-weight: 600;
        border: none;
        background: transparent;
        width: 100%;
        padding: 4px 0;
        border-bottom: 1px solid transparent;
      }
      .meal-name-input:hover,
      .meal-name-input:focus {
        border-bottom: 1px solid var(--line);
        outline: none;
      }

      .drawer-dial-wrap {
        display: flex;
        justify-content: center;
        margin: 20px 0 6px;
      }
      .drawer-dial {
        width: 130px;
        height: 130px;
      }
      .drawer-dial .dial-inner {
        inset: 12px;
      }
      .drawer-dial .dial-kcal {
        font-size: 24px;
      }

      .section-label {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--ink-muted);
        margin: 22px 0 10px;
      }

      .item-row {
        display: grid;
        grid-template-columns: 16px minmax(0, 1fr) 72px 18px 56px 15px;
        align-items: center;
        gap: 8px;
        padding: 10px 0;
        border-bottom: 1px solid var(--line);
      }
      .item-drag {
        width: 16px;
        color: var(--ink-muted);
        cursor: grab;
        font-size: 13px;
        letter-spacing: 1px;
        flex: none;
      }
      .item-drag:active {
        cursor: grabbing;
      }
      .item-row.dragging {
        opacity: 0.4;
      }
      .item-row.drag-over {
        box-shadow: none;
      }
      .item-name {
        flex: 1;
        font-size: 14px;
        line-height: 1.3;
      }
      .item-unit {
        font-size: 11px;
        color: var(--ink-muted);
        text-align: center;
      }
      .item-qty {
        width: 100%;
        padding: 9px 10px;
        border: 1px solid var(--line);
        border-radius: 9px;
        font-family: "IBM Plex Mono", monospace;
        font-size: 13px;
        background: var(--bg);
        min-height: 40px;
      }
      .item-qty:focus {
        outline: 2px solid var(--green);
        outline-offset: 1px;
      }
      .item-kcal {
        width: 56px;
        text-align: right;
        font-family: "IBM Plex Mono", monospace;
        font-size: 12px;
        color: var(--ink-muted);
      }
      .item-head {
        display: grid;
        grid-template-columns: 16px 1fr 60px 18px 56px 15px;
        gap: 8px;
        align-items: center;
        padding: 0 0 6px;
        color: var(--ink-muted);
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
      }
      .item-head span:nth-child(5) {
        text-align: right;
      }
      .item-remove {
        background: none;
        color: var(--ink-muted);
        font-size: 15px;
        padding: 2px 4px;
      }
      .item-remove:hover {
        color: var(--red);
      }

      .add-item-row {
        display: flex;
        gap: 8px;
        margin-top: 12px;
        align-items: center;
      }
      .add-item-select {
        flex: 1;
        padding: 10px 12px;
        border: 1px solid var(--line);
        border-radius: 9px;
        background: var(--surface);
        font-size: 13px;
        min-height: 40px;
      }
      .add-item-qty {
        width: 72px;
        padding: 10px 9px;
        border: 1px solid var(--line);
        border-radius: 9px;
        font-family: "IBM Plex Mono", monospace;
        font-size: 13px;
        min-height: 40px;
      }

      .empty-note {
        color: var(--ink-muted);
        font-size: 13px;
        padding: 10px 0;
      }

      .drawer-footer {
        margin-top: 30px;
        padding-top: 16px;
        border-top: 1px solid var(--line);
        display: flex;
        justify-content: flex-end;
      }

      /* ---------- Ingredients modal ---------- */
      .modal-backdrop {
        position: fixed;
        inset: 0;
        background: rgba(var(--backdrop-rgb), 0.7);
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.18s ease;
        z-index: 30;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .modal-backdrop.open {
        opacity: 1;
        pointer-events: auto;
      }
      .modal {
        background: var(--surface);
        border-radius: 18px;
        width: 560px;
        max-width: 92vw;
        max-height: 84vh;
        overflow-y: auto;
        padding: 26px 26px 22px;
        position: relative;
      }
      .modal h2 {
        font-size: 21px;
        margin-bottom: 4px;
      }
      .modal .subtitle {
        margin-bottom: 18px;
      }
      .confirm-modal {
        width: 460px;
        max-width: 92vw;
      }
      .confirm-modal .modal-footer {
        justify-content: flex-end;
        gap: 10px;
      }
      .confirm-modal .modal-footer .btn {
        min-width: 110px;
      }
      #confirmModalBackdrop {
        z-index: 40;
      }
      #confirmModal {
        z-index: 41;
      }
      #ingModalBackdrop {
        z-index: 35;
      }

      .manager-item-row {
        display: flex;
        align-items: stretch;
        gap: 4px;
      }
      .manager-item-row .manager-item {
        flex: 1;
        min-width: 0;
      }
      .manager-drag {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 22px;
        flex: none;
        color: var(--ink-muted);
        cursor: grab;
        font-size: 14px;
        letter-spacing: 1px;
        border-radius: 8px;
        touch-action: none;
      }
      .manager-drag:hover {
        color: var(--ink);
        background: var(--surface-alt);
      }
      .manager-drag:active {
        cursor: grabbing;
      }
      .manager-drag.disabled {
        opacity: 0.25;
        cursor: default;
        pointer-events: none;
      }
      .manager-item-row.dragging {
        opacity: 0.4;
      }
      .manager-item-row.drag-over .manager-item {
        border-color: var(--green);
      }
      .ing-head {
        display: grid;
        grid-template-columns: 16px 1fr 70px 90px 30px;
        gap: 8px;
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--ink-muted);
        padding-bottom: 6px;
      }
      .ing-remove {
        background: none;
        color: var(--ink-muted);
        font-size: 15px;
      }
      .ing-remove:hover {
        color: var(--red);
      }
      .ing-search {
        width: 100%;
        padding: 9px 12px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: var(--bg);
        font-size: 13px;
        margin: 14px 0 12px;
      }
      .ing-search-note {
        font-size: 11px;
        color: var(--ink-muted);
        margin: -6px 0 10px;
      }

      .add-ing-row {
        display: grid;
        grid-template-columns: 16px 1fr 70px 90px 30px;
        gap: 8px;
        margin-top: 12px;
        align-items: center;
      }

      .modal-footer {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: 20px;
        padding-top: 14px;
        border-top: 1px solid var(--line);
      }

      /* ---------- Auth ---------- */
      .auth-shell {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }
      .auth-card {
        width: 420px;
        max-width: 100%;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 20px;
        padding: 30px;
        box-shadow: 0 14px 40px rgba(var(--shadow-rgb), 0.08);
      }
      .auth-card h1 {
        font-size: 30px;
        margin-bottom: 6px;
      }
      .auth-card .subtitle {
        margin-bottom: 22px;
      }
      .auth-tabs {
        display: flex;
        gap: 4px;
        background: var(--surface-alt);
        padding: 4px;
        border-radius: 10px;
        margin-bottom: 18px;
      }
      .auth-tab {
        flex: 1;
        padding: 9px;
        border-radius: 8px;
        background: transparent;
        color: var(--ink-muted);
        font-weight: 600;
        font-size: 13px;
      }
      .auth-tab.active {
        background: var(--surface);
        color: var(--ink);
        box-shadow: 0 1px 4px rgba(var(--shadow-rgb), 0.08);
      }
      .auth-field {
        margin-bottom: 12px;
      }
      .auth-field label {
        display: block;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--ink-muted);
        margin-bottom: 6px;
      }
      .auth-field input,
      .auth-field select,
      .log-date-input {
        width: 100%;
        padding: 10px 12px;
        border: 1px solid var(--line);
        border-radius: 9px;
        background: var(--bg);
        font-size: 14px;
        appearance: none;
        -webkit-appearance: none;
        -moz-appearance: none;
      }
      .auth-field input:focus,
      .auth-field select:focus,
      .log-date-input:focus {
        outline: 2px solid var(--green);
        outline-offset: 1px;
      }
      .auth-field select {
        background-image: url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 10 6'><path fill='%236E7A6A' d='M0 0l5 6 5-6z'/></svg>");
        background-repeat: no-repeat;
        background-position: right 12px center;
        background-size: 10px 6px;
      }
      .log-date-input {
        max-width: 190px;
      }
      .auth-submit {
        width: 100%;
        margin-top: 6px;
      }
      .auth-message {
        font-size: 12px;
        margin-top: 12px;
        min-height: 16px;
      }
      .auth-message.error {
        color: var(--red);
      }
      .auth-message.ok {
        color: var(--green);
      }
      .auth-note {
        font-size: 11px;
        color: var(--ink-muted);
        margin-top: 16px;
        line-height: 1.5;
      }

      /* ---------- Loading / footer ---------- */
      .loading-state {
        text-align: center;
        padding: 80px 0;
        color: var(--ink-muted);
        font-size: 14px;
      }

      .home {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .home-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
      }
      .home-header .eyebrow {
        margin: 0 0 3px;
      }
      .home-header .subtitle {
        margin: 0;
      }
      .header-actions {
        display: flex;
        gap: 10px;
        align-items: center;
      }
      .icon-btn {
        width: 38px;
        height: 38px;
        border-radius: 50%;
        background: var(--surface);
        border: 1px solid var(--line);
        color: var(--ink);
        font-size: 17px;
        display: flex;
        align-items: center;
        justify-content: center;
        transition:
          background 0.15s ease,
          border-color 0.15s ease;
      }
      .icon-btn:hover {
        background: var(--surface-alt);
        border-color: rgba(var(--shadow-rgb), 0.12);
      }
      .header-username {
        font-size: 13px;
        color: var(--ink-muted);
        padding: 8px 12px;
        border-radius: 999px;
        border: 1px solid var(--line);
        background: var(--surface);
      }
      .today-card {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 20px;
        padding: 12px 12px 10px 12px;
        box-shadow: 1px 2px 8px rgba(var(--shadow-rgb), 0.06);
      }
      .today-meal-card {
        border-radius: 20px;
        padding: 5px 12px 5px 12px;
      }
      .today-snack-card {
        border-radius: 20px;
        padding: 5px 12px 5px 12px;
      }
      .today-top {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
      }
      .today-date-row {
        display: flex;
        align-items: center;
        gap: 30px;
      }
      .today-date {
        font-family: "Fraunces", serif;
        font-size: 22px;
        font-weight: 600;
        margin-bottom: 0;
        text-align: left;
      }
      .today-date small {
        display: block;
        font-family: "Inter", sans-serif;
        font-size: 11px;
        font-weight: 500;
        color: var(--ink-muted);
        margin-top: 3px;
      }
      .date-picker-trigger {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        padding: 0 4px;
        background: transparent;
        color: var(--ink);
      }
      .date-picker-trigger:hover .today-date {
        color: var(--green);
      }
      .date-picker-icon {
        width: 16px;
        height: 16px;
        color: var(--ink-muted);
        flex: none;
      }
      .date-picker-input {
        position: absolute;
        width: 1px;
        height: 1px;
        opacity: 0;
        pointer-events: none;
      }
      .today-kcal {
        font-family: "IBM Plex Mono", monospace;
        color: var(--ink);
        text-align: right;
        white-space: nowrap;
      }
      .today-kcal strong {
        display: block;
        font-size: 20px;
      }
      .today-kcal .goal-kcal {
        color: var(--ink-muted);
        font-family: inherit;
        font-size: inherit;
        font-weight: inherit;
      }
      .today-metrics {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        gap: 8px;
        margin-top: 16px;
      }
      .metric {
        background: var(--bg);
        border-radius: 12px;
        padding: 10px 8px;
        text-align: center;
      }
      .metric .value {
        font-family: "IBM Plex Mono", monospace;
        font-size: 15px;
        font-weight: 600;
      }
      .metric .label {
        font-size: 9px;
        text-transform: uppercase;
        letter-spacing: 0.07em;
        color: var(--ink-muted);
        margin-top: 3px;
      }
      .metric.deficit .value {
        color: var(--green);
      }
      .metric.surplus .value {

    </style>
  </head>
  <body>
    <div class="app-shell" id="app">
      <div class="loading-state" id="loading">Loading your pantry…</div>
    </div>

    <div class="backdrop" id="drawerBackdrop"></div>
    <div class="drawer" id="drawer"></div>

    <div class="modal-backdrop" id="ingModalBackdrop">
      <div class="modal" id="ingModal"></div>
    </div>

    <div class="modal-backdrop" id="transferModalBackdrop">
      <div class="modal" id="transferModal"></div>
    </div>

    <div class="modal-backdrop" id="historyModalBackdrop">
      <div class="modal" id="historyModal"></div>
    </div>

    <div class="modal-backdrop" id="confirmModalBackdrop">
      <div class="modal confirm-modal" id="confirmModal">
        <h2 id="confirmTitle">Confirm</h2>
        <div class="subtitle" id="confirmMessage">Are you sure?</div>
        <div class="modal-footer" id="confirmFooter">
          <button class="btn btn-secondary" id="confirmCancelBtn">
            Cancel
          </button>
          <button class="btn btn-danger-outline" id="confirmOkBtn">
            Delete
          </button>
        </div>
      </div>
    </div>

    <script>
      /* ===================== Theme ===================== */
      function getTheme() {
        return document.documentElement.getAttribute("data-theme") === "dark"
          ? "dark"
          : "light";
      }
      function setTheme(theme) {
        document.documentElement.setAttribute("data-theme", theme);
        try {
          localStorage.setItem("theme", theme);
        } catch (e) {}
        const meta = document.getElementById("themeColorMeta");
        if (meta)
          meta.setAttribute(
            "content",
            theme === "dark" ? "#10150f" : "#f3f5ee",
          );
      }
      setTheme(getTheme());

      /* ===================== Data ===================== */
      const DEFAULT_MAINTENANCE = 2200;

      let ingredients = [];
      let meals = [];
      let snacks = [];
      let logs = {}; // dateStr (YYYY-MM-DD) -> log entry
      let maintenanceCal = DEFAULT_MAINTENANCE;
      let openMealId = null;
      let ingModalOpen = false;
      let ingModalView = "list";
      let ingEditorId = null;
      let ingEditorReturnTo = "ingredientsModal";
      let transferModalOpen = false;
      let historyModalOpen = false;
      let dataLoaded = false;
      let ingSearchTerm = "";
      let managerMealSearchTerm = "";
      let managerSnackSearchTerm = "";
      let managerIngredientSearchTerm = "";
      let itemDragFromId = null;
      let mealDragFromId = null;
      let snackDragFromId = null;
      let ingredientDragFromId = null;
      let logDate = todayStr();
      let showKcal = true;
      let foodManagerTab = "meals";

      const DEFAULT_SNACKS = [
        { id: "snack-apple", name: "Apple", kcal: 95 },
        { id: "snack-banana", name: "Banana", kcal: 105 },
        { id: "snack-orange", name: "Orange", kcal: 62 },
        { id: "snack-sardines", name: "Sardines (tin)", kcal: 220 },
      ];

      function defaultLogEntry() {
        return {
          mode: "meal",
          mealId: null,
          mealServings: 1,
          manualMealName: "",
          manualMealKcal: 0,
          snacks: [],
        };
      }

      /* ===================== SQLite backend ===================== */
      let currentUser = null;

      async function api(path, options = {}) {
        const res = await fetch(path, {
          headers: {
            "Content-Type": "application/json",
            ...(options.headers || {}),
          },
          ...options,
        });
        let body = null;
        try {
          body = await res.json();
        } catch (e) {}
        if (!res.ok)
          throw new Error(body?.error || `Request failed (${res.status})`);
        return body;
      }

      function setSaveStatus(state) {
        // Save status is no longer shown in the header.
      }

      async function loadData() {
        if (!currentUser) return;
        try {
          const result = await api("/api/data");
          const parsed = result.data || {};
          ingredients = Array.isArray(parsed.ingredients)
            ? parsed.ingredients
            : [];
          meals = Array.isArray(parsed.meals) ? parsed.meals : [];
          snacks = Array.isArray(parsed.snacks)
            ? parsed.snacks
            : DEFAULT_SNACKS.map((s) => ({ ...s }));
          logs =
            parsed.logs && typeof parsed.logs === "object" ? parsed.logs : {};
          maintenanceCal = parsed.maintenanceCal || DEFAULT_MAINTENANCE;
          showKcal = parsed.showKcal !== false;
        } catch (e) {
          console.error("Load failed", e);
          ingredients = [];
          meals = [];
          snacks = DEFAULT_SNACKS.map((s) => ({ ...s }));
          logs = {};
          maintenanceCal = DEFAULT_MAINTENANCE;
          showKcal = true;
        }
        dataLoaded = true;
        renderApp();
      }

      async function saveData() {
        if (!dataLoaded || !currentUser) return;
        setSaveStatus("saving");
        try {
          await api("/api/data", {
            method: "PUT",
            body: JSON.stringify({
              ingredients,
              meals,
              snacks,
              logs,
              maintenanceCal,
              showKcal,
            }),
          });
          setSaveStatus("ok");
        } catch (e) {
          console.error("Save failed", e);
          setSaveStatus("error");
        }
      }

      function showAuth(message = "", isError = false) {
        document.getElementById("app").innerHTML =
          `<div class="auth-shell"><div class="auth-card"><div class="eyebrow">Pantry to Plate</div><h1>Meal Builder</h1><div class="subtitle">Sign in to keep your meals, snacks and history in your SQLite database.</div><div class="auth-tabs"><button class="auth-tab active" id="loginTab">Log in</button><button class="auth-tab" id="signupTab">Sign up</button></div><form id="authForm"><div class="auth-field"><label>Username</label><input id="authUsername" type="text" autocomplete="username" required minlength="3" placeholder="Choose a username"></div><div class="auth-field"><label>Password</label><input id="authPassword" type="password" autocomplete="current-password" minlength="6" required placeholder="At least 6 characters"></div><button class="btn btn-primary auth-submit" type="submit" id="authSubmit">Log in</button></form><div class="auth-message ${isError ? "error" : "ok"}" id="authMessage">${escapeHtml(message)}</div><div class="auth-note">Your account and Meal Builder data are stored in the local SQLite database on the server.</div></div></div>`;
        let mode = "login";
        const loginTab = document.getElementById("loginTab"),
          signupTab = document.getElementById("signupTab"),
          submit = document.getElementById("authSubmit"),
          form = document.getElementById("authForm"),
          msg = document.getElementById("authMessage");
        function setMode(next) {
          mode = next;
          loginTab.classList.toggle("active", mode === "login");
          signupTab.classList.toggle("active", mode === "signup");
          submit.textContent = mode === "login" ? "Log in" : "Create account";
          document
            .getElementById("authPassword")
            .setAttribute(
              "autocomplete",
              mode === "login" ? "current-password" : "new-password",
            );
          msg.textContent = "";
          msg.className = "auth-message";
        }
        loginTab.onclick = () => setMode("login");
        signupTab.onclick = () => setMode("signup");
        form.onsubmit = async (e) => {
          e.preventDefault();
          submit.disabled = true;
          msg.textContent =
            mode === "login" ? "Signing in…" : "Creating account…";
          msg.className = "auth-message";
          const username = document.getElementById("authUsername").value.trim(),
            password = document.getElementById("authPassword").value;
          try {
            const result = await api(
              mode === "login" ? "/api/login" : "/api/signup",
              { method: "POST", body: JSON.stringify({ username, password }) },
            );
            currentUser = result.user;
            await loadData();
          } catch (err) {
            console.error(err);
            msg.textContent = err.message || "Authentication failed.";
            msg.className = "auth-message error";
            submit.disabled = false;
          }
        };
      }

      function showConfirmModal({
        title = "Confirm",
        message = "Are you sure?",
        okLabel = "Delete",
        onConfirm,
      }) {
        const backdrop = document.getElementById("confirmModalBackdrop");
        const modal = document.getElementById("confirmModal");
        const titleEl = document.getElementById("confirmTitle");
        const messageEl = document.getElementById("confirmMessage");
        const okBtn = document.getElementById("confirmOkBtn");
        const cancelBtn = document.getElementById("confirmCancelBtn");

        titleEl.textContent = title;
        messageEl.textContent = message;
        okBtn.textContent = okLabel;

        const close = () => backdrop.classList.remove("open");
        const cleanup = () => {
          cancelBtn.onclick = null;
          okBtn.onclick = null;
          backdrop.removeEventListener("click", backdropClick);
        };
        const backdropClick = (e) => {
          if (e.target.id === "confirmModalBackdrop") {
            cleanup();
            close();
          }
        };

        cancelBtn.onclick = () => {
          cleanup();
          close();
        };
        okBtn.onclick = async () => {
          cleanup();
          close();
          if (typeof onConfirm === "function") await onConfirm();
        };
        backdrop.addEventListener("click", backdropClick);
        backdrop.classList.add("open");
      }

      async function signOut() {
        try {
          await api("/api/logout", { method: "POST", body: "{}" });
        } catch (e) {}
        currentUser = null;
        dataLoaded = false;
        showAuth("You have been signed out.");
      }

      async function initAuth() {
        try {
          const result = await api("/api/me");
          currentUser = result.user || null;
        } catch (e) {
          currentUser = null;
        }
        if (currentUser) await loadData();
        else showAuth();
      }

      async function updateMaintenance(value) {
        const v = parseFloat(value);
        maintenanceCal =
          isNaN(v) || v <= 0 ? DEFAULT_MAINTENANCE : Math.round(v);
        await saveData();
        renderApp();
      }

      async function reorderMealItems(mealId, fromId, toId) {
        if (!fromId || !toId || fromId === toId) return;
        const meal = meals.find((m) => m.id === mealId);
        if (!meal) return;
        const fromIndex = meal.items.findIndex(
          (it) => it.ingredientId === fromId,
        );
        const toIndex = meal.items.findIndex((it) => it.ingredientId === toId);
        if (fromIndex === -1 || toIndex === -1) return;
        const [moved] = meal.items.splice(fromIndex, 1);
        meal.items.splice(toIndex, 0, moved);
        await saveData();
        renderDrawer();
      }

      async function reorderMeals(fromId, toId) {
        if (!fromId || !toId || fromId === toId) return;
        const fromIndex = meals.findIndex((m) => m.id === fromId);
        const toIndex = meals.findIndex((m) => m.id === toId);
        if (fromIndex === -1 || toIndex === -1) return;
        const [moved] = meals.splice(fromIndex, 1);
        meals.splice(toIndex, 0, moved);
        await saveData();
        renderApp();
      }

      async function reorderSnacks(fromId, toId) {
        if (!fromId || !toId || fromId === toId) return;
        const fromIndex = snacks.findIndex((s) => s.id === fromId);
        const toIndex = snacks.findIndex((s) => s.id === toId);
        if (fromIndex === -1 || toIndex === -1) return;
        const [moved] = snacks.splice(fromIndex, 1);
        snacks.splice(toIndex, 0, moved);
        await saveData();
        renderApp();
      }

      async function reorderIngredients(fromId, toId) {
        if (!fromId || !toId || fromId === toId) return;
        const fromIndex = ingredients.findIndex((i) => i.id === fromId);
        const toIndex = ingredients.findIndex((i) => i.id === toId);
        if (fromIndex === -1 || toIndex === -1) return;
        const [moved] = ingredients.splice(fromIndex, 1);
        ingredients.splice(toIndex, 0, moved);
        await saveData();
        renderApp();
        if (openMealId) renderDrawer();
      }

      /* Generic drag-to-reorder wiring for .manager-item-row lists.
         get/set track the currently dragged row's id; onDrop performs the reorder. */
      function wireManagerDrag(container, { get, set, onDrop }) {
        if (!container) return;
        container.querySelectorAll(".manager-item-row").forEach((row) => {
          const handle = row.querySelector("[data-manager-drag]");
          if (!handle || handle.classList.contains("disabled")) return;
          const arm = () => row.setAttribute("draggable", "true");
          handle.addEventListener("mousedown", arm);
          handle.addEventListener("touchstart", arm, { passive: true });
          row.addEventListener("dragstart", (e) => {
            set(row.getAttribute("data-manager-id"));
            row.classList.add("dragging");
            e.dataTransfer.effectAllowed = "move";
          });
          row.addEventListener("dragend", () => {
            row.classList.remove("dragging");
            row.setAttribute("draggable", "false");
            container
              .querySelectorAll(".manager-item-row")
              .forEach((r) => r.classList.remove("drag-over"));
            setTimeout(() => set(null), 0);
          });
          row.addEventListener("dragover", (e) => {
            e.preventDefault();
            e.dataTransfer.dropEffect = "move";
            row.classList.add("drag-over");
          });
          row.addEventListener("dragleave", () =>
            row.classList.remove("drag-over"),
          );
          row.addEventListener("drop", (e) => {
            e.preventDefault();
            row.classList.remove("drag-over");
            onDrop(get(), row.getAttribute("data-manager-id"));
          });
        });
      }

      /* ===================== Helpers ===================== */
      function uid(prefix) {
        return prefix + "-" + Math.random().toString(36).slice(2, 9);
      }

      /* ---- Date helpers (all local-time, avoid UTC shift) ---- */
      function formatDateISO(d) {
        const y = d.getFullYear();
        const m = String(d.getMonth() + 1).padStart(2, "0");
        const day = String(d.getDate()).padStart(2, "0");
        return `${y}-${m}-${day}`;
      }
      function todayStr() {
        return formatDateISO(new Date());
      }
      function parseISODate(ds) {
        const [y, m, d] = ds.split("-").map(Number);
        return new Date(y, m - 1, d);
      }
      function shiftDateStr(ds, days) {
        const d = parseISODate(ds);
        d.setDate(d.getDate() + days);
        return formatDateISO(d);
      }
      function prettyDate(ds) {
        const d = parseISODate(ds);
        return d.toLocaleDateString(undefined, {
          weekday: "short",
          day: "numeric",
          month: "short",
          year: "numeric",
        });
      }
      function shortDate(ds) {
        const d = parseISODate(ds);
        return d.toLocaleDateString(undefined, {
          day: "numeric",
          month: "short",
        });
      }

      function getIngredient(id) {
        return ingredients.find((i) => i.id === id);
      }

      function itemKcal(item) {
        const ing = getIngredient(item.ingredientId);
        if (!ing) return 0;
        return ing.unit === "g"
          ? (item.amount / 100) * ing.kcal
          : item.amount * ing.kcal;
      }

      function mealKcal(meal) {
        return Math.round(
          meal.items.reduce((sum, it) => sum + itemKcal(it), 0),
        );
      }

      function kcalColor(kcal) {
        const cap = maintenanceCal > 0 ? maintenanceCal : 1800;
        const pct = cap > 0 ? kcal / cap : 0;
        if (pct < 0.5)
          return { solid: "var(--green)", soft: "var(--green-soft)" };
        if (pct < 0.6)
          return { solid: "var(--orange)", soft: "var(--orange-soft)" };
        return { solid: "var(--red)", soft: "var(--red-soft)" };
      }

      function historyHeatColor(deficit, max) {
        if (!Number.isFinite(deficit) || max <= 0) return "var(--surface-alt)";
        const intensity = Math.min(1, Math.abs(deficit) / max);
        const isDark =
          document.documentElement.getAttribute("data-theme") === "dark";
        const greenShades = isDark
          ? ["#1c2b1f", "#20372a", "#2a4a34", "#3a6b45", "#4c8f57"]
          : ["#edf6ec", "#d7ebd7", "#bde1bc", "#8fcf8d", "#5c9f5b"];
        const redShades = isDark
          ? ["#2f221f", "#3d2a24", "#5a3129", "#813a2c", "#a7402c"]
          : ["#f9e5e1", "#f3c7be", "#eb9b8f", "#e16661", "#b63d38"];
        const idx = Math.min(
          greenShades.length - 1,
          Math.floor(intensity * greenShades.length),
        );
        return deficit >= 0 ? greenShades[idx] : redShades[idx];
      }

      function dialHTML(kcal, big) {
        const cap = maintenanceCal > 0 ? maintenanceCal : 1800;
        const pct = Math.max(0, Math.min(1, kcal / cap));
        const deg = Math.round(pct * 360);
        const c = kcalColor(kcal);
        const cls = big ? "dial drawer-dial" : "dial";
        return `<div class="${cls}" style="background:conic-gradient(${c.solid} ${deg}deg, var(--surface-alt) ${deg}deg)">
    <div class="dial-inner">
      <div class="dial-kcal" style="color:${c.solid}">${kcal.toLocaleString()}</div>
      <div class="dial-kcal-label">kcal</div>
    </div>
  </div>`;
      }

      function escapeHtml(s) {
        return String(s).replace(
          /[&<>"']/g,
          (m) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[m],
        );
      }

      /* ===================== Render: single-page home ===================== */
      function getHistoryDaysForViewport() {
        return window.innerWidth <= 480 ? 14 : 28;
      }

      function renderApp() {
        if (!currentUser || !dataLoaded) {
          showAuth();
          return;
        }
        const log = getLog(logDate),
          deficit = logDeficit(log);
        const historyDays = getHistoryDaysForViewport();
        const gridColumns = historyDays;
        const hist = computeHistory(historyDays);
        const historyBarHeight = 108;
        // Keep breathing room above maintenance when there are no surplus days.
        // Expand dynamically when a logged intake exceeds the default ceiling.
        const HISTORY_DEFAULT_CEILING = 2400;
        const historyScale = Math.max(
          maintenanceCal,
          HISTORY_DEFAULT_CEILING,
          1,
          ...hist.filter((h) => h.hasLog).map((h) => h.total),
        );
        const historyLoggedDays = hist.filter((h) => h.hasLog);
        const historyAvgDeficit = historyLoggedDays.length
          ? Math.round(
              historyLoggedDays.reduce((s, h) => s + h.deficit, 0) /
                historyLoggedDays.length,
            )
          : 0;
        // ~7700 kcal deficit/surplus is roughly equivalent to 1kg of body fat.
        const KCAL_PER_KG = 7700;
        const projectedKgPerWeek = (historyAvgDeficit * 7) / KCAL_PER_KG;
        const movingAvg = historyMovingAverage(hist, 7);
        const trendPoints = movingAvg.map((v, i) => {
          if (v === null) return null;
          const scaledV = Math.min(v, historyScale);
          const x = ((i + 0.5) / gridColumns) * 100;
          const y = Math.max(
            0,
            historyBarHeight - (scaledV / historyScale) * historyBarHeight,
          );
          return { x, y };
        });
        const trendPaths = smoothLinePaths(trendPoints);
        const goalLineBottom = Math.round(
          24 + (maintenanceCal / historyScale) * historyBarHeight,
        );
        const mealK = logMealKcal(log),
          snackK = logSnacksKcal(log),
          totalK = mealK + snackK;
        const barTotal = Math.max(maintenanceCal, totalK, 1);
        const mealPct = Math.min(100, (mealK / barTotal) * 100);
        const snackPct = Math.min(100 - mealPct, (snackK / barTotal) * 100);
        document.getElementById("app").innerHTML = `
    <div class="home">
      <section>
        <div class="today-top">
          <div class="today-date-row">
            <button class="date-arrow" id="homePrevDay" aria-label="Previous day">‹</button>
            <button type="button" class="date-picker-trigger" id="homeDatePicker" aria-label="Choose date">
              <span class="today-date">${prettyDate(logDate).replace(/, \d{4}$/, "")}<small>${logDate === todayStr() ? "Today" : "Selected day"}</small></span>
              <svg class="date-picker-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M16 3v4M8 3v4M3 10h18"></path></svg>
            </button>
            <input class="date-picker-input" type="date" id="homeDateInput" value="${logDate}" max="${todayStr()}" aria-label="Choose log date">
            <button class="date-arrow" id="homeNextDay" aria-label="Next day" ${logDate === todayStr() ? "disabled" : ""}>›</button>
          </div>
        </section>
      <section class="today-card">
                <div class="today-top">
          <div class="today-kcal"><strong>${totalK.toLocaleString()} <span class="goal-kcal">/ ${maintenanceCal.toLocaleString()} kcal</span></strong></div>
        </div>
        <div class="today-status">
          <div class="today-status-bar">
            <div class="status-seg meal" style="width:${mealPct}%"></div>
            <div class="status-seg snack" style="width:${snackPct}%"></div>
            <div class="status-seg deficit" style="width:${Math.max(0, 100 - mealPct - snackPct)}%"></div>
          </div>
          <div class="today-status-labels">
            <div class="status-pill meal"><span>Meals</span><strong>${mealK.toLocaleString()} <small>kcal</small></strong></div>
            <div class="status-pill snack"><span>Snacks</span><strong>${snackK.toLocaleString()} <small>kcal</small></strong></div>
            <div class="status-pill ${deficit >= 0 ? "deficit" : "surplus"}"><span>${deficit >= 0 ? "Deficit" : "Surplus"}</span><strong>${Math.abs(deficit).toLocaleString()} <small>kcal</small></strong></div>
          </div>
          </div>
      </section>
            <section class="today-meal-card">
              <div class="today-chips">
          <div class="chip-group">
          <div class="chip-group-header">
            <span>1. Select meal for today</span>
            <button type="button" class="chip-group-menu-btn" data-chip-menu="meals" aria-label="Meal options" aria-expanded="false">⋯</button>
            <div class="chip-group-menu" data-chip-menu-panel="meals">
              <button type="button" id="editMealsChipBtn" data-edit-food-menu="meals">✎ Edit meals</button>
              <button type="button" id="newMealsChipBtn">+ Add meal</button>
            </div>
      </div>
            <div class="chip-list${showKcal ? "" : " kcal-hidden"}">
              ${
                meals.length
                  ? meals
                      .map((m) => {
                        const isActive =
                          log.mode === "meal" && log.mealId === m.id;
                        return `<button type="button" class="today-chip${isActive ? " active" : ""}" data-select-meal="${m.id}"><span>${escapeHtml(m.name)}</span><span class="chip-kcal">${mealKcal(m).toLocaleString()} kcal</span></button>`;
                      })
                      .join("")

              const total = Math.max(0, h.total || 0);
              const baseKcal = Math.min(total, maintenanceCal);

              const barHeight = h.hasLog
                ? Math.max(
                    5,

                : 0;
              const mealShare =
                total > 0 ? Math.min(1, Math.max(0, h.mealK / total)) : 0;

                ? Math.round(baseHeight * mealShare)

              const snackHeight = h.hasLog

          items: original.items.map((it) => ({
            ingredientId: it.ingredientId,
            amount: it.amount,

        renderApp();
        openMealEditor(copy.id);

        const meal = meals.find((m) => m.id === id);

          meal.name = name || "Untitled meal";
          await saveData();
          renderApp();

      async function updateItemAmount(mealId, ingredientId, amount) {
        const meal = meals.find((m) => m.id === mealId);
        const item = meal.items.find((it) => it.ingredientId === ingredientId);
        if (item) {
          item.amount = isNaN(amount) ? 0 : amount;
          await saveData();
          renderApp();
          renderDrawer();
        }
      }

      async function removeItem(mealId, ingredientId) {
        const meal = meals.find((m) => m.id === mealId);
        meal.items = meal.items.filter(
          (it) => it.ingredientId !== ingredientId,
        );
        await saveData();
        renderApp();
        renderDrawer();
      }

      async function addItemToMeal(mealId, ingredientId, amount) {
        if (!ingredientId) return;
        const meal = meals.find((m) => m.id === mealId);
        if (meal.items.some((it) => it.ingredientId === ingredientId)) return;
        meal.items.push({
          ingredientId,
          amount: isNaN(amount) || amount <= 0 ? 1 : amount,
        });
        await saveData();
        renderApp();
        renderDrawer();
      }

            removeItem(meal.id, e.target.getAttribute("data-remove")),
          );
        });
        drawer.querySelectorAll(".item-row").forEach((row) => {
          const handle = row.querySelector("[data-item-drag]");
          if (handle) {
            handle.addEventListener("mousedown", () =>
              row.setAttribute("draggable", "true"),
            );
            handle.addEventListener(
              "touchstart",
              () => row.setAttribute("draggable", "true"),
              { passive: true },
            );
          }
          row.addEventListener("dragstart", (e) => {
            itemDragFromId = row.getAttribute("data-item-id");
            row.classList.add("dragging");
            e.dataTransfer.effectAllowed = "move";
          });
          row.addEventListener("dragend", () => {
            row.classList.remove("dragging");
            row.setAttribute("draggable", "false");
            drawer
              .querySelectorAll(".item-row")
              .forEach((r) => r.classList.remove("drag-over"));
            setTimeout(() => {
              itemDragFromId = null;
            }, 0);
          });
          row.addEventListener("dragover", (e) => {
            e.preventDefault();
            e.dataTransfer.dropEffect = "move";
            row.classList.add("drag-over");
          });
          row.addEventListener("dragleave", () =>
            row.classList.remove("drag-over"),
          );
          row.addEventListener("drop", (e) => {

              meal.id,
              itemDragFromId,
              row.getAttribute("data-item-id"),
            );
          });
        });

                await saveData();
                renderApp();
                if (openMealId) renderDrawer();
                if (ingEditorReturnTo === "foodManager") {
                  closeIngredientsModal();
                  openFoodManager("ingredients");
                } else {
                  openIngredientsModal();
                }
              } else {
                await addIngredient(
                  name,
                  unit,
                  kcal,
                  ingEditorReturnTo === "foodManager",
                );
                if (ingEditorReturnTo === "foodManager") {
                  closeIngredientsModal();
                  openFoodManager("ingredients");
                } else {
                  openIngredientsModal();
                }
              }
            });

          if (ingredient.id) {
            document
              .getElementById("deleteIngredientBtn")
              .addEventListener("click", async () => {
                await deleteIngredient(ingredient.id, ingEditorReturnTo);
              });
          }
          return;
        }

        const term = ingSearchTerm.trim().toLowerCase();
        const filtered = term
          ? ingredients.filter((i) => i.name.toLowerCase().includes(term))
          : ingredients;
        const dragOk = !term && filtered.length > 1;

        modal.innerHTML = `
    <button class="drawer-close" id="ingModalCloseBtn" aria-label="Close" style="position:absolute;top:18px;right:18px;">×</button>
    <h2>Ingredients</h2>
    <div class="subtitle">Calories per 100g for weighed items, or per item for things you count.</div>
    <input class="ing-search" id="ingSearchInput" type="search" placeholder="Search ingredients…" value="${escapeHtml(ingSearchTerm)}" />
    ${term ? `<div class="ing-search-note">${filtered.length} of ${ingredients.length} shown.</div>` : ""}
    <div class="manager-list" id="ingModalList">${
      filtered.length
        ? filtered
            .map(
              (i) =>
                `<div class="manager-item-row" data-manager-id="${i.id}"><span class="manager-drag${dragOk ? "" : " disabled"}" data-manager-drag title="Drag to reorder">⠿</span><button class="manager-item" data-manager-ingredient="${i.id}"><span><strong>${escapeHtml(i.name)}</strong><small>${i.kcal} kcal ${i.unit === "g" ? "/ 100g" : "/ item"}</small></span><span>›</span></button></div>`,
            )
            .join("")
        : '<div class="empty-note">No ingredients match that search.</div>'
    }
    </div>
    <div class="section-label">Add new</div>
    <button class="btn btn-primary primary-wide" id="addIngBtn">＋ New ingredient</button>
    <div class="modal-footer">
      <span class="subtitle" style="margin:0;">${ingredients.length} ingredients on file</span>
      <button class="btn btn-secondary" id="ingDoneBtn">Done</button>
    </div>
  `;

        const closeButton = document.getElementById("ingModalCloseBtn");
        if (closeButton) {
          closeButton.addEventListener("click", closeIngredientsModal);
        }
        const doneButton = document.getElementById("ingDoneBtn");
        if (doneButton) {
          doneButton.addEventListener("click", closeIngredientsModal);
        }
        const searchInput = document.getElementById("ingSearchInput");
        if (searchInput) {
          searchInput.addEventListener("input", (e) => {
            ingSearchTerm = e.target.value;
            renderIngredientsModal();
            const el = document.getElementById("ingSearchInput");
            if (el) {
              el.focus();
              el.selectionStart = el.selectionEnd = el.value.length;
            }
          });
        }
        const addBtn = document.getElementById("addIngBtn");
        if (addBtn) {
          addBtn.addEventListener("click", () => openIngredientEditor());
        }
        document
          .querySelectorAll("[data-manager-ingredient]")
          .forEach((btn) => {
            btn.addEventListener("click", (e) =>
              openIngredientEditor(e.currentTarget.dataset.managerIngredient),
            );
          });
        wireManagerDrag(document.getElementById("ingModalList"), {
          get: () => ingredientDragFromId,
          set: (id) => (ingredientDragFromId = id),
          onDrop: async (fromId, toId) => {
            await reorderIngredients(fromId, toId);
            renderIngredientsModal();
          },
        });
      }

      document
        .getElementById("ingModalBackdrop")
        .addEventListener("click", (e) => {
          if (e.target.id === "ingModalBackdrop") closeIngredientsModal();
        });

      /* ===================== Snacks tab ===================== */
      async function addSnack(name, kcal) {
        if (!name || !name.trim()) return null;
        const snack = {
          id: uid("snack"),
          name: name.trim(),
          kcal: isNaN(kcal) ? 0 : kcal,
        };
        snacks.push(snack);
        await saveData();
        renderApp();
        return snack.id;
      }

      async function updateSnackField(id, field, value) {
        const snack = snacks.find((s) => s.id === id);
        if (!snack) return;
        if (field === "name") snack.name = value || snack.name;
        if (field === "kcal") snack.kcal = isNaN(value) ? snack.kcal : value;
        await saveData();
        renderApp();
      }

      async function deleteSnack(id) {
        showConfirmModal({
          title: "Delete snack",
          message:
            "Delete this snack? It will be removed from any past logged days too.",
          okLabel: "Delete snack",
          onConfirm: async () => {
            snacks = snacks.filter((s) => s.id !== id);
            Object.values(logs).forEach((log) => {
              log.snacks = log.snacks.filter((e) => e.snackId !== id);
            });
            await saveData();
            renderApp();
          },
        });
      }

      /* ===================== Daily log: data + compute ===================== */
      function getLog(dateStr) {
        return logs[dateStr] || defaultLogEntry();
      }
      function ensureLog(dateStr) {
        if (!logs[dateStr]) logs[dateStr] = defaultLogEntry();
        return logs[dateStr];
      }

      function logMealKcal(log) {
        if (log.mode === "custom") return Math.round(log.manualMealKcal || 0);
        const meal = meals.find((m) => m.id === log.mealId);
        if (!meal) return 0;
        return Math.round(mealKcal(meal) * (log.mealServings || 1));
      }
      function logSnacksKcal(log) {
        return Math.round(
          (log.snacks || []).reduce((sum, e) => {
            if (e.custom) return sum + (e.kcal || 0) * e.qty;
            const snack = snacks.find((s) => s.id === e.snackId);
            return sum + (snack ? snack.kcal * e.qty : 0);
          }, 0),
        );
      }
      function logTotalKcal(log) {
        return logMealKcal(log) + logSnacksKcal(log);
      }
      function logDeficit(log) {
        return maintenanceCal - logTotalKcal(log);
      }
      function logHasEntries(log) {
        return (
          (!!log &&
            (log.mode === "custom"
              ? log.manualMealKcal > 0 || !!log.manualMealName
              : !!log.mealId)) ||
          (log && log.snacks && log.snacks.length > 0)
        );
      }

      /* ===================== Daily log: mutators ===================== */
      function refreshLog() {
        renderApp();
      }
      async function setLogMode(dateStr, mode) {
        const log = ensureLog(dateStr);
        log.mode = mode;
        await saveData();
        refreshLog();
      }
      async function setLogMeal(dateStr, mealId) {
        const log = ensureLog(dateStr);
        log.mealId = mealId || null;
        await saveData();
        refreshLog();
      }
      async function setLogMealServings(dateStr, servings) {
        const log = ensureLog(dateStr);
        log.mealServings = isNaN(servings) || servings <= 0 ? 1 : servings;
        await saveData();
        refreshLog();
      }
      async function setManualMeal(dateStr, name, kcal) {
        const log = ensureLog(dateStr);
        log.manualMealName = name;
        log.manualMealKcal = isNaN(kcal) ? 0 : kcal;
        await saveData();
        refreshLog();
      }
      async function addLogSnack(dateStr, snackId, qty) {
        if (!snackId) return;
        const log = ensureLog(dateStr);
        const q = isNaN(qty) || qty <= 0 ? 1 : qty;
        const existing = log.snacks.find((e) => e.snackId === snackId);
        if (existing) existing.qty += q;
        else log.snacks.push({ snackId, qty: q });
        await saveData();
        refreshLog();
      }
      async function updateLogSnackQty(dateStr, snackId, qty) {
        const log = ensureLog(dateStr);
        const entry = log.snacks.find((e) => e.snackId === snackId);
        if (entry) {
          entry.qty = isNaN(qty) || qty <= 0 ? entry.qty : qty;
          await saveData();
          refreshLog();
        }
      }
      async function removeLogSnack(dateStr, snackId) {
        const log = ensureLog(dateStr);
        log.snacks = log.snacks.filter((e) => e.snackId !== snackId);
        await saveData();
        refreshLog();
      }
      async function addCustomLogSnack(dateStr, name, kcal, qty) {
        const log = ensureLog(dateStr);
        log.snacks.push({
          id: uid("logsnack"),
          custom: true,
          name: (name || "Snack").trim() || "Snack",
          kcal: isNaN(kcal) || kcal < 0 ? 0 : kcal,
          qty: isNaN(qty) || qty <= 0 ? 1 : qty,
        });
        await saveData();
        refreshLog();
      }
      async function incrementCustomLogSnack(dateStr, id) {
        const log = ensureLog(dateStr);
        const entry = log.snacks.find((e) => e.custom && e.id === id);
        if (!entry) return;
        entry.qty += 1;
        await saveData();
        refreshLog();
      }
      async function decrementCustomLogSnack(dateStr, id) {
        const log = ensureLog(dateStr);
        const entry = log.snacks.find((e) => e.custom && e.id === id);
        if (!entry) return;
        if (entry.qty <= 1) {
          log.snacks = log.snacks.filter((e) => !(e.custom && e.id === id));
        } else {
          entry.qty -= 1;
        }
        await saveData();
        refreshLog();
      }
      async function clearLogDay(dateStr) {
        showConfirmModal({
          title: "Clear day",
          message: "Clear everything logged for this day?",
          okLabel: "Clear day",
          onConfirm: async () => {
            delete logs[dateStr];
            await saveData();
            refreshLog();
          },
        });
      }

      async function resetLogSnacks(dateStr) {
        const log = ensureLog(dateStr);
        if (!log.snacks || !log.snacks.length) return;
        log.snacks = [];
        await saveData();
        refreshLog();
      }

      async function setLogDateView(dateStr) {
        logDate = dateStr;
        renderApp();
      }

      /* ===================== Daily log: render (main tab) ===================== */
      function computeHistory(days) {
        const arr = [];
        for (let i = days - 1; i >= 0; i--) {
          const ds = shiftDateStr(todayStr(), -i);
          const log = logs[ds];
          const has = logHasEntries(log);
          arr.push({
            date: ds,
            total: log ? logTotalKcal(log) : 0,
            mealK: log ? logMealKcal(log) : 0,
            snackK: log ? logSnacksKcal(log) : 0,
            deficit: log ? logDeficit(log) : 0,
            hasLog: has,
          });
        }
        return arr;
      }

      // 7-day trailing moving average of total kcal intake, based only on
      // logged days within each window. Returns null for indices where no
      // logged day exists in the trailing window (creates a gap in the line).
      function historyMovingAverage(hist, windowSize) {
        const w = windowSize || 7;
        return hist.map((_, i) => {
          const start = Math.max(0, i - w + 1);
          const windowDays = hist.slice(start, i + 1).filter((h) => h.hasLog);
          if (!windowDays.length) return null;
          return (
            windowDays.reduce((sum, h) => sum + h.total, 0) / windowDays.length
          );
        });
      }

      // Builds smooth (Catmull-Rom) SVG path strings through a set of
      // {x,y} points, splitting on null gaps into separate contiguous paths.
      function smoothLinePaths(points) {
        const segments = [];
        let current = [];
        points.forEach((p) => {
          if (p === null) {
            if (current.length) segments.push(current);
            current = [];
          } else {
            current.push(p);
          }
        });
        if (current.length) segments.push(current);
        return segments.map((seg) => {
          if (seg.length === 1) {
            return `M${seg[0].x},${seg[0].y} L${seg[0].x},${seg[0].y}`;
          }
          let d = `M${seg[0].x},${seg[0].y}`;
          for (let i = 0; i < seg.length - 1; i++) {
            const p0 = seg[i - 1] || seg[i];
            const p1 = seg[i];
            const p2 = seg[i + 1];
            const p3 = seg[i + 2] || p2;
            const cp1x = p1.x + (p2.x - p0.x) / 6;
            const cp1y = p1.y + (p2.y - p0.y) / 6;
            const cp2x = p2.x - (p3.x - p1.x) / 6;
            const cp2y = p2.y - (p3.y - p1.y) / 6;
            d += ` C${cp1x.toFixed(2)},${cp1y.toFixed(2)} ${cp2x.toFixed(2)},${cp2y.toFixed(2)} ${p2.x.toFixed(2)},${p2.y.toFixed(2)}`;
          }
          return d;
        });
      }

      /* ===================== Export ===================== */
      function closeTransferModal() {
        transferModalOpen = false;
        document
          .getElementById("transferModalBackdrop")
          .classList.remove("open");
      }

      function currentExportJSON() {
        return JSON.stringify(
          { ingredients, meals, snacks, logs, maintenanceCal, showKcal },
          null,
          2,
        );
      }

      function downloadExport() {
        const blob = new Blob([currentExportJSON()], {
          type: "application/json",
        });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = "meal-builder-export.json";
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      }

      document
        .getElementById("transferModalBackdrop")
        .addEventListener("click", (e) => {
          if (e.target.id === "transferModalBackdrop") closeTransferModal();
        });

      function openHistoryModal() {
        historyModalOpen = true;
        renderHistoryModal();
        document.getElementById("historyModalBackdrop").classList.add("open");
      }

      function closeHistoryModal() {
        historyModalOpen = false;
        document
          .getElementById("historyModalBackdrop")
          .classList.remove("open");
      }

      function renderHistoryModal() {
        const modal = document.getElementById("historyModal");
        if (!historyModalOpen) {
          modal.innerHTML = "";
          return;
        }
        // Build list of all logged days; if none, fall back to last 90 days
        let histAll = [];
        const logDates = Object.keys(logs || {}).sort();
        if (logDates.length) {
          histAll = logDates.map((ds) => {
            const log = logs[ds];
            return {
              date: ds,
              total: log ? logTotalKcal(log) : 0,
              deficit: log ? logDeficit(log) : 0,
              hasLog: logHasEntries(log),
            };
          });
        } else {
          histAll = computeHistory(90);
        }
        const maxAll = Math.max(
          100,
          ...histAll.map((h) => Math.abs(h.deficit)),
        );
        modal.innerHTML = `
    <button class="drawer-close" id="historyCloseBtn" aria-label="Close" style="position:absolute;top:18px;right:18px;">×</button>
    <h2>Full history</h2>
    <div class="subtitle">Last ${histAll.length} days</div>
    <div style="display:grid;grid-template-columns:repeat(12,1fr);gap:8px;margin-top:14px;max-height:60vh;overflow:auto;">
      ${histAll
        .map((h) => {
          const color = h.hasLog
            ? historyHeatColor(h.deficit, maxAll)
            : "var(--surface-alt)";
          const label = h.hasLog
            ? `${prettyDate(h.date)}: ${h.deficit >= 0 ? `${h.deficit} deficit` : `${Math.abs(h.deficit)} surplus`}`
            : "Not logged";
          const v = h.hasLog
            ? h.deficit >= 0
              ? `${h.deficit}`
              : `-${Math.abs(h.deficit)}`
            : "";
          return `<div style="padding:10px;border-radius:8px;background:${color};text-align:center;border:1px solid var(--line);">${v}<div style="font-size:10px;color:var(--ink-muted);margin-top:6px;">${parseISODate(h.date).toLocaleDateString()}</div></div>`;
        })
        .join("")}
    </div>
  `;
        document
          .getElementById("historyCloseBtn")
          .addEventListener("click", closeHistoryModal);
      }

      document
        .getElementById("historyModalBackdrop")
        .addEventListener("click", (e) => {
          if (e.target.id === "historyModalBackdrop") closeHistoryModal();
        });

      /* ===================== Init ===================== */
      initAuth();
    </script>
  </body>
</html>
