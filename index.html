<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meal Builder</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍋</text></svg>">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap');

:root{
  --bg:#F3F5EE;
  --surface:#FFFFFF;
  --surface-alt:#EAEFE2;
  --ink:#1C2A1F;
  --ink-muted:#6E7A6A;
  --line:#DDE3D3;
  --green:#3F6B4A;
  --green-soft:#E4EEE3;
  --orange:#DD8034;
  --orange-soft:#FBEADC;
  --red:#C1442C;
  --red-soft:#F7E1DA;
  --radius:16px;
}

*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;}
h1,h2,h3{font-family:'Fraunces',serif;margin:0;}
.mono{font-family:'IBM Plex Mono',monospace;}

.app-shell{max-width:1080px;margin:0 auto;padding:36px 24px 80px;}

/* ---------- Header ---------- */
header.top{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap;margin-bottom:28px;}
.eyebrow{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--green);margin-bottom:6px;}
h1.title{font-size:34px;font-weight:600;color:var(--ink);}
.subtitle{color:var(--ink-muted);font-size:14px;margin-top:6px;}
.header-actions{display:flex;gap:10px;align-items:center;}
.save-status{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink-muted);display:flex;align-items:center;gap:6px;transition:color .2s ease;}
.save-status .dot{width:6px;height:6px;border-radius:50%;background:var(--green);}
.save-status.error{color:var(--red);}
.save-status.error .dot{background:var(--red);}
.save-status.saving .dot{background:var(--orange);}

button{font-family:'Inter',sans-serif;cursor:pointer;border:none;}
.btn{padding:10px 16px;border-radius:999px;font-size:13px;font-weight:600;transition:transform .12s ease, box-shadow .12s ease;}
.btn:active{transform:scale(.97);}
.btn-primary{background:var(--green);color:#fff;}
.btn-primary:hover{box-shadow:0 4px 14px rgba(63,107,74,.3);}
.btn-secondary{background:var(--surface);color:var(--ink);border:1px solid var(--line);}
.btn-secondary:hover{background:var(--surface-alt);}
.btn-danger{background:transparent;color:var(--red);}
.btn-danger:hover{text-decoration:underline;}

/* ---------- Summary bar ---------- */
.summary-bar{display:flex;gap:28px;padding:14px 20px;background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-bottom:26px;flex-wrap:wrap;align-items:center;}
.summary-stat .num{font-family:'IBM Plex Mono',monospace;font-size:18px;font-weight:600;}
.summary-stat .label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-muted);margin-top:2px;}
.summary-stat.editable .num{display:flex;align-items:center;gap:4px;}
.maintenance-input{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:18px;width:76px;border:none;background:transparent;color:var(--ink);border-bottom:1px dashed var(--line);padding:0 0 1px;}
.maintenance-input:focus{outline:none;border-bottom-color:var(--green);}
.summary-spacer{flex:1;}
.pct-tag{font-family:'IBM Plex Mono',monospace;font-size:11px;padding:3px 8px;border-radius:999px;}

/* ---------- Drag to reorder ---------- */
.meal-card{position:relative;}
.meal-card.dragging{opacity:.4;}
.meal-card.drag-over{box-shadow:none;}
.drag-handle{position:absolute;top:10px;left:10px;width:22px;height:22px;border-radius:6px;display:flex;align-items:center;justify-content:center;color:var(--ink-muted);cursor:grab;font-size:13px;letter-spacing:1px;line-height:1;background:transparent;}
.drag-handle:hover{background:var(--surface-alt);color:var(--ink);}
.drag-handle:active{cursor:grabbing;}
.copy-handle{position:absolute;top:10px;right:10px;width:22px;height:22px;border-radius:6px;display:flex;align-items:center;justify-content:center;color:var(--ink-muted);font-size:13px;background:transparent;}
.copy-handle:hover{background:var(--surface-alt);color:var(--green);}

/* ---------- Meal grid ---------- */
.meal-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px;}
.meal-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px 18px 16px;cursor:pointer;transition:transform .14s ease, box-shadow .14s ease;position:relative;}
.meal-card:hover{transform:translateY(-3px);box-shadow:0 10px 24px rgba(28,42,31,.09);}
.meal-card:focus-visible{outline:2px solid var(--green);outline-offset:2px;}

.dial{width:96px;height:96px;border-radius:50%;margin:0 auto 14px;position:relative;}
.dial-inner{position:absolute;inset:9px;background:var(--surface);border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.dial-kcal{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:18px;line-height:1;}
.dial-kcal-label{font-size:9px;color:var(--ink-muted);text-transform:uppercase;letter-spacing:.08em;margin-top:3px;}

.meal-name{text-align:center;font-size:17px;font-weight:500;margin-bottom:6px;}
.meal-meta{text-align:center;font-size:12px;color:var(--ink-muted);}
.chip-row{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;margin-top:12px;}
.chip{background:var(--surface-alt);color:var(--ink-muted);font-size:11px;padding:3px 9px;border-radius:999px;}

.add-card{display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px;border:1.5px dashed var(--line);border-radius:var(--radius);color:var(--ink-muted);min-height:190px;background:transparent;transition:border-color .12s ease, color .12s ease;}
.add-card:hover{border-color:var(--green);color:var(--green);}
.add-card .plus{font-size:26px;line-height:1;}

/* ---------- Drawer ---------- */
.backdrop{position:fixed;inset:0;background:rgba(20,28,20,.32);opacity:0;pointer-events:none;transition:opacity .18s ease;z-index:20;}
.backdrop.open{opacity:1;pointer-events:auto;}

.drawer{position:fixed;top:0;right:0;height:100vh;width:400px;max-width:92vw;background:var(--bg);box-shadow:-12px 0 30px rgba(20,28,20,.14);transform:translateX(100%);transition:transform .22s ease;z-index:21;overflow-y:auto;padding:26px 24px 40px;}
.drawer.open{transform:translateX(0);}
@media (prefers-reduced-motion: reduce){.drawer,.backdrop{transition:none;}}

.drawer-close{position:absolute;top:20px;right:20px;background:var(--surface);border:1px solid var(--line);width:32px;height:32px;border-radius:50%;font-size:16px;color:var(--ink-muted);display:flex;align-items:center;justify-content:center;}
.drawer-close:hover{color:var(--ink);}

.meal-name-input{font-family:'Fraunces',serif;font-size:24px;font-weight:600;border:none;background:transparent;width:100%;padding:4px 0;border-bottom:1px solid transparent;}
.meal-name-input:hover,.meal-name-input:focus{border-bottom:1px solid var(--line);outline:none;}

.drawer-dial-wrap{display:flex;justify-content:center;margin:20px 0 6px;}
.drawer-dial{width:130px;height:130px;}
.drawer-dial .dial-inner{inset:12px;}
.drawer-dial .dial-kcal{font-size:24px;}

.section-label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-muted);margin:22px 0 10px;}

.item-row{display:grid;grid-template-columns:16px minmax(0,1fr) 60px 18px 56px 15px;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--line);}
.item-drag{width:16px;color:var(--ink-muted);cursor:grab;font-size:13px;letter-spacing:1px;flex:none;}
.item-drag:active{cursor:grabbing;}
.item-row.dragging{opacity:.4;}
.item-row.drag-over{box-shadow:none;}
.item-name{flex:1;font-size:14px;}
.item-unit{font-size:11px;color:var(--ink-muted);}
.item-qty{width:100%;padding:6px 8px;border:1px solid var(--line);border-radius:8px;font-family:'IBM Plex Mono',monospace;font-size:13px;background:var(--surface);}
.item-qty:focus{outline:2px solid var(--green);outline-offset:1px;}
.item-kcal{width:56px;text-align:right;font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--ink-muted);}
.item-head{display:grid;grid-template-columns:16px 1fr 60px 18px 56px 15px;gap:8px;align-items:center;padding:0 0 6px;color:var(--ink-muted);font-size:10px;text-transform:uppercase;letter-spacing:.06em;}
.item-head span:nth-child(5){text-align:right;}
.item-remove{background:none;color:var(--ink-muted);font-size:15px;padding:2px 4px;}
.item-remove:hover{color:var(--red);}

.add-item-row{display:flex;gap:8px;margin-top:12px;}
.add-item-select{flex:1;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-size:13px;}
.add-item-qty{width:60px;padding:8px;border:1px solid var(--line);border-radius:8px;font-family:'IBM Plex Mono',monospace;font-size:13px;}

.empty-note{color:var(--ink-muted);font-size:13px;padding:10px 0;}

.drawer-footer{margin-top:30px;padding-top:16px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;}

/* ---------- Ingredients modal ---------- */
.modal-backdrop{position:fixed;inset:0;background:rgba(20,28,20,.32);opacity:0;pointer-events:none;transition:opacity .18s ease;z-index:30;display:flex;align-items:center;justify-content:center;}
.modal-backdrop.open{opacity:1;pointer-events:auto;}
.modal{background:var(--surface);border-radius:18px;width:560px;max-width:92vw;max-height:84vh;overflow-y:auto;padding:26px 26px 22px;position:relative;}
.modal h2{font-size:21px;margin-bottom:4px;}
.modal .subtitle{margin-bottom:18px;}

.ing-row{display:grid;grid-template-columns:16px 1fr 70px 90px 30px;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line);}
.ing-row input, .ing-row select{padding:6px 8px;border:1px solid var(--line);border-radius:8px;font-size:13px;font-family:'Inter',sans-serif;background:var(--bg);width:100%;}
.ing-row .kcal-input{font-family:'IBM Plex Mono',monospace;}
.ing-row.dragging{opacity:.4;}
.ing-row.drag-over{box-shadow:none;}
.ing-drag{color:var(--ink-muted);cursor:grab;font-size:13px;letter-spacing:1px;text-align:center;}
.ing-drag.disabled{opacity:.25;cursor:default;}
.ing-drag:active{cursor:grabbing;}
.ing-head{display:grid;grid-template-columns:16px 1fr 70px 90px 30px;gap:8px;font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-muted);padding-bottom:6px;}
.ing-remove{background:none;color:var(--ink-muted);font-size:15px;}
.ing-remove:hover{color:var(--red);}
.ing-search{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);font-size:13px;margin:14px 0 12px;}
.ing-search-note{font-size:11px;color:var(--ink-muted);margin:-6px 0 10px;}

.add-ing-row{display:grid;grid-template-columns:16px 1fr 70px 90px 30px;gap:8px;margin-top:12px;align-items:center;}

.modal-footer{display:flex;justify-content:space-between;align-items:center;margin-top:20px;padding-top:14px;border-top:1px solid var(--line);}

.export-textarea{width:100%;height:140px;font-family:'IBM Plex Mono',monospace;font-size:11px;border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--bg);resize:vertical;margin-top:8px;}
.import-row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;}
.file-label{display:inline-flex;align-items:center;padding:9px 14px;border:1px solid var(--line);border-radius:999px;font-size:13px;cursor:pointer;background:var(--surface);}
.file-label:hover{background:var(--surface-alt);}
.import-msg{font-size:12px;margin-top:8px;}
.import-msg.ok{color:var(--green);}
.import-msg.err{color:var(--red);}

/* ---------- Auth ---------- */
.auth-shell{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
.auth-card{width:420px;max-width:100%;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:30px;box-shadow:0 14px 40px rgba(28,42,31,.08);}
.auth-card h1{font-size:30px;margin-bottom:6px;}
.auth-card .subtitle{margin-bottom:22px;}
.auth-tabs{display:flex;gap:4px;background:var(--surface-alt);padding:4px;border-radius:10px;margin-bottom:18px;}
.auth-tab{flex:1;padding:9px;border-radius:8px;background:transparent;color:var(--ink-muted);font-weight:600;font-size:13px;}
.auth-tab.active{background:var(--surface);color:var(--ink);box-shadow:0 1px 4px rgba(28,42,31,.08);}
.auth-field{margin-bottom:12px;}
.auth-field label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-muted);margin-bottom:6px;}
.auth-field input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:9px;background:var(--bg);font-size:14px;}
.auth-field input:focus{outline:2px solid var(--green);outline-offset:1px;}
.auth-submit{width:100%;margin-top:6px;}
.auth-message{font-size:12px;margin-top:12px;min-height:16px;}
.auth-message.error{color:var(--red);}
.auth-message.ok{color:var(--green);}
.auth-note{font-size:11px;color:var(--ink-muted);margin-top:16px;line-height:1.5;}
.user-email{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink-muted);}

/* ---------- Loading / footer ---------- */
.loading-state{text-align:center;padding:80px 0;color:var(--ink-muted);font-size:14px;}

/* ---------- Tabs ---------- */
.tab-nav{display:flex;gap:4px;margin-bottom:24px;border-bottom:1px solid var(--line);}
.tab-btn{background:transparent;padding:11px 16px;font-size:13px;font-weight:600;color:var(--ink-muted);border-bottom:2px solid transparent;border-radius:0;margin-bottom:-1px;}
.tab-btn:hover{color:var(--ink);}
.tab-btn.active{color:var(--green);border-bottom-color:var(--green);}
.tab-toolbar{display:flex;justify-content:flex-end;margin-bottom:14px;}

/* ---------- Cards (generic) ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px 22px;margin-bottom:20px;}
.card h3{font-size:15px;font-weight:600;margin-bottom:14px;}
.card .card-sub{color:var(--ink-muted);font-size:12px;margin-top:-10px;margin-bottom:14px;}

/* ---------- Snacks tab ---------- */
.snack-row{display:grid;grid-template-columns:16px 1fr 90px 30px;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);}
.snack-row input{padding:7px 9px;border:1px solid var(--line);border-radius:8px;font-size:13px;font-family:'Inter',sans-serif;background:var(--bg);width:100%;}
.snack-row .kcal-input{font-family:'IBM Plex Mono',monospace;}
.snack-head{display:grid;grid-template-columns:16px 1fr 90px 30px;gap:8px;font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-muted);padding-bottom:6px;}
.add-snack-row{display:grid;grid-template-columns:16px 1fr 90px 30px;gap:8px;margin-top:12px;align-items:center;}
.snack-remove{background:none;color:var(--ink-muted);font-size:15px;}
.snack-remove:hover{color:var(--red);}

/* ---------- Log tab ---------- */
.log-date-nav{display:flex;align-items:center;gap:10px;margin-bottom:22px;flex-wrap:wrap;}
.date-arrow{background:var(--surface);border:1px solid var(--line);width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--ink);flex:none;}
.date-arrow:hover{background:var(--surface-alt);}
.log-date-input{font-family:'IBM Plex Mono',monospace;font-size:14px;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);}
.log-date-label{font-family:'Fraunces',serif;font-size:19px;font-weight:600;}

.mode-toggle{display:flex;gap:6px;margin-bottom:16px;}
.mode-btn{padding:7px 14px;border-radius:999px;font-size:12px;font-weight:600;background:var(--surface-alt);color:var(--ink-muted);}
.mode-btn.active{background:var(--green);color:#fff;}

.meal-select-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
.meal-select-row select{flex:1;min-width:180px;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-size:13px;}
.servings-input{width:72px;padding:9px 8px;border:1px solid var(--line);border-radius:8px;font-family:'IBM Plex Mono',monospace;font-size:13px;}
.custom-meal-row{display:flex;gap:10px;flex-wrap:wrap;}
.custom-meal-row input{padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-size:13px;}
.custom-meal-row input.cm-name{flex:1;min-width:160px;}
.custom-meal-row input.cm-kcal{width:100px;font-family:'IBM Plex Mono',monospace;}
.field-note{font-size:11px;color:var(--ink-muted);margin-top:8px;}

.snack-add-row{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;}
.snack-add-row select{flex:1;min-width:160px;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-size:13px;}
.snack-add-row input{width:64px;padding:9px 8px;border:1px solid var(--line);border-radius:8px;font-family:'IBM Plex Mono',monospace;font-size:13px;}

.logged-snack-list{margin-top:10px;}
.logged-snack-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px;}
.logged-snack-row .lsr-name{flex:1;}
.logged-snack-row input{width:56px;padding:5px 7px;border:1px solid var(--line);border-radius:6px;font-family:'IBM Plex Mono',monospace;font-size:12px;}
.logged-snack-row .lsr-kcal{width:60px;text-align:right;font-family:'IBM Plex Mono',monospace;color:var(--ink-muted);}
.logged-snack-row .item-remove{flex:none;}

.day-summary{display:flex;gap:30px;flex-wrap:wrap;align-items:center;}
.day-summary .dial{margin:0;flex:none;}
.day-stat .num{font-family:'IBM Plex Mono',monospace;font-size:22px;font-weight:600;}
.day-stat .label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-muted);margin-top:2px;}
.day-stat .num.pos{color:var(--green);}
.day-stat .num.neg{color:var(--red);}

/* big day summary card (top of log tab) */
.day-summary-card .dial{width:120px;height:120px;}
.day-summary-card .dial-kcal{font-size:22px;}
.day-summary-card .day-stat .num{font-size:28px;}
.day-summary-card .day-stat.deficit .num{font-size:34px;}

/* food-logged summary + chips */
.log-food-header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:14px;}
.log-food-header h3{margin:0;}
.log-chip-group{margin-bottom:12px;}
.log-chip-group-label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-muted);margin-bottom:8px;}
.log-chip-row{display:flex;flex-wrap:wrap;gap:8px;}
.log-chip{display:inline-flex;align-items:center;gap:8px;background:var(--surface-alt);border-radius:999px;padding:7px 14px;font-size:13px;}
.log-chip .lc-kcal{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink-muted);}
.log-food-empty{color:var(--ink-muted);font-size:13px;padding:6px 0 4px;}

/* history chart */
.chart-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:10px;}
.range-toggle{display:flex;gap:6px;}
.range-btn{padding:6px 12px;border-radius:999px;font-size:12px;font-weight:600;background:var(--surface-alt);color:var(--ink-muted);}
.range-btn.active{background:var(--green);color:#fff;}
.chart-legend{display:flex;gap:16px;font-size:11px;color:var(--ink-muted);flex-wrap:wrap;}
.legend-dot{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px;vertical-align:middle;}

.chart-scroll{overflow-x:auto;padding-bottom:4px;}
.chart-track{display:flex;align-items:flex-start;gap:5px;min-width:100%;}
.chart-col{display:flex;flex-direction:column;align-items:center;flex:1;min-width:22px;}
.chart-bars{width:100%;display:flex;flex-direction:column;}
.chart-zone{width:100%;display:flex;}
.chart-zone.top{height:78px;align-items:flex-end;justify-content:center;}
.chart-zone.bottom{height:78px;align-items:flex-start;justify-content:center;border-top:1px dashed var(--line);}
.chart-bar{width:64%;min-height:2px;border-radius:3px 3px 0 0;background:var(--green);}
.chart-bar.neg{border-radius:0 0 3px 3px;background:var(--red);}
.chart-bar.empty{background:var(--line);width:5px;border-radius:2px;}
.chart-date{font-size:9px;color:var(--ink-muted);margin-top:6px;white-space:nowrap;}

.chart-empty-note{color:var(--ink-muted);font-size:13px;padding:30px 0;text-align:center;}
.snack-drag{color:var(--ink-muted);cursor:grab;font-size:13px;letter-spacing:1px;text-align:center;}
.snack-drag:active{cursor:grabbing;}
.snack-row.dragging{opacity:.4;}
.snack-row.drag-over{box-shadow:none;}
.snack-search{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);font-size:13px;margin:14px 0 12px;}

<body>

<div class="app-shell" id="app">
  <div class="loading-state" id="loading">Loading your pantry…</div>
</div>

<div class="backdrop" id="drawerBackdrop"></div>
<div class="drawer" id="drawer"></div>

<div class="modal-backdrop" id="ingModalBackdrop">
  <div class="modal" id="ingModal"></div>
</div>

<div class="modal-backdrop" id="transferModalBackdrop">
  <div class="modal" id="transferModal"></div>
</div>

<div class="modal-backdrop" id="logFoodModalBackdrop">
  <div class="modal" id="logFoodModal"></div>
</div>

<script>
/* ===================== Data ===================== */
const DEFAULT_MAINTENANCE = 2200;

let ingredients = [];
let meals = [];
let snacks = [];
let logs = {}; // dateStr (YYYY-MM-DD) -> log entry
let maintenanceCal = DEFAULT_MAINTENANCE;
let openMealId = null;
let ingModalOpen = false;
let transferModalOpen = false;
let dataLoaded = false;
let ingSearchTerm = '';
let ingDragFromId = null;
let itemDragFromId = null;
let currentTab = 'history';
let snackSearchTerm = '';
let snackDragFromId = null;
let logDate = todayStr();
let chartRangeDays = 14;
let logFoodModalOpen = false;

const DEFAULT_SNACKS = [
  {id:'snack-apple', name:'Apple', kcal:95},
  {id:'snack-banana', name:'Banana', kcal:105},
  {id:'snack-orange', name:'Orange', kcal:62},
  {id:'snack-sardines', name:'Sardines (tin)', kcal:220}
];

function defaultLogEntry(){
  return {mode:'meal', mealId:null, mealServings:1, manualMealName:'', manualMealKcal:0, snacks:[]};
}

/* ===================== SQLite backend ===================== */
let currentUser = null;

async function api(path, options={}){
  const res = await fetch(path, {headers:{"Content-Type":"application/json", ...(options.headers||{})}, ...options});
  let body=null; try{ body=await res.json(); }catch(e){}
  if(!res.ok) throw new Error(body?.error || `Request failed (${res.status})`);
  return body;
}

function setSaveStatus(state){
  const el=document.getElementById('saveStatus'); if(!el) return;
  el.classList.remove('error','saving');
  if(state==='saving'){el.classList.add('saving');el.querySelector('.txt').textContent='Saving…';}
  else if(state==='error'){el.classList.add('error');el.querySelector('.txt').textContent='Save failed';}
  else el.querySelector('.txt').textContent='Saved to database';
}

async function loadData(){
  if(!currentUser) return;
  try{
    const result=await api('/api/data');
    const parsed=result.data || {};
    ingredients=Array.isArray(parsed.ingredients)?parsed.ingredients:[];
    meals=Array.isArray(parsed.meals)?parsed.meals:[];
    snacks=Array.isArray(parsed.snacks)?parsed.snacks:DEFAULT_SNACKS.map(s=>({...s}));
    logs=(parsed.logs&&typeof parsed.logs==='object')?parsed.logs:{};
    maintenanceCal=parsed.maintenanceCal||DEFAULT_MAINTENANCE;
  }catch(e){
    console.error('Load failed',e);
    ingredients=[]; meals=[]; snacks=DEFAULT_SNACKS.map(s=>({...s})); logs={}; maintenanceCal=DEFAULT_MAINTENANCE;
  }
  dataLoaded=true; renderApp();
}

async function saveData(){
  if(!dataLoaded||!currentUser) return;
  setSaveStatus('saving');
  try{
    await api('/api/data',{method:'PUT',body:JSON.stringify({ingredients,meals,snacks,logs,maintenanceCal})});
    setSaveStatus('ok');
  }catch(e){console.error('Save failed',e);setSaveStatus('error');}
}

function showAuth(message='',isError=false){
  document.getElementById('app').innerHTML=`<div class="auth-shell"><div class="auth-card"><div class="eyebrow">Pantry to Plate</div><h1>Meal Builder</h1><div class="subtitle">Sign in to keep your meals, snacks and history in your SQLite database.</div><div class="auth-tabs"><button class="auth-tab active" id="loginTab">Log in</button><button class="auth-tab" id="signupTab">Sign up</button></div><form id="authForm"><div class="auth-field"><label>Username</label><input id="authUsername" type="text" autocomplete="username" required minlength="3" placeholder="Choose a username"></div><div class="auth-field"><label>Password</label><input id="authPassword" type="password" autocomplete="current-password" minlength="6" required placeholder="At least 6 characters"></div><button class="btn btn-primary auth-submit" type="submit" id="authSubmit">Log in</button></form><div class="auth-message ${isError?'error':'ok'}" id="authMessage">${escapeHtml(message)}</div><div class="auth-note">Your account and Meal Builder data are stored in the local SQLite database on the server.</div></div></div>`;
  let mode='login'; const loginTab=document.getElementById('loginTab'),signupTab=document.getElementById('signupTab'),submit=document.getElementById('authSubmit'),form=document.getElementById('authForm'),msg=document.getElementById('authMessage');
  function setMode(next){mode=next;loginTab.classList.toggle('active',mode==='login');signupTab.classList.toggle('active',mode==='signup');submit.textContent=mode==='login'?'Log in':'Create account';document.getElementById('authPassword').setAttribute('autocomplete',mode==='login'?'current-password':'new-password');msg.textContent='';msg.className='auth-message';}
  loginTab.onclick=()=>setMode('login'); signupTab.onclick=()=>setMode('signup');
  form.onsubmit=async e=>{
    e.preventDefault(); submit.disabled=true; msg.textContent=mode==='login'?'Signing in…':'Creating account…'; msg.className='auth-message';
    const username=document.getElementById('authUsername').value.trim(), password=document.getElementById('authPassword').value;
    try{
      const result=await api(mode==='login'?'/api/login':'/api/signup',{method:'POST',body:JSON.stringify({username,password})});
      currentUser=result.user; await loadData();
    }catch(err){console.error(err);msg.textContent=err.message||'Authentication failed.';msg.className='auth-message error';submit.disabled=false;}
  };
}

async function signOut(){try{await api('/api/logout',{method:'POST',body:'{}'});}catch(e){} currentUser=null;dataLoaded=false;showAuth('You have been signed out.');}

async function initAuth(){
  try{ const result=await api('/api/me'); currentUser=result.user||null; }catch(e){ currentUser=null; }
  if(currentUser) await loadData(); else showAuth();
}

async function updateMaintenance(value){
  const v = parseFloat(value);
  maintenanceCal = isNaN(v) || v <= 0 ? DEFAULT_MAINTENANCE : Math.round(v);
  await saveData();
  renderApp();
}

/* ===================== Reordering ===================== */
let dragFromIndex = null;

async function reorderMeals(fromIndex, toIndex){
  if(fromIndex === toIndex || fromIndex == null || toIndex == null) return;
  const [moved] = meals.splice(fromIndex, 1);
  meals.splice(toIndex, 0, moved);
  await saveData();
  renderApp();
}

async function reorderSnacks(fromId, toId){
  if(!fromId || !toId || fromId === toId) return;
  const fromIndex = snacks.findIndex(s => s.id === fromId);
  const toIndex = snacks.findIndex(s => s.id === toId);
  if(fromIndex === -1 || toIndex === -1) return;
  const [moved] = snacks.splice(fromIndex, 1);
  const adjustedTo = fromIndex < toIndex ? toIndex - 1 : toIndex;
  snacks.splice(adjustedTo, 0, moved);
  await saveData();
  renderApp();
}

async function reorderIngredients(fromId, toId){
  if(!fromId || !toId || fromId === toId) return;
  const fromIndex = ingredients.findIndex(i => i.id === fromId);
  const toIndex = ingredients.findIndex(i => i.id === toId);
  if(fromIndex === -1 || toIndex === -1) return;
  const [moved] = ingredients.splice(fromIndex, 1);
  ingredients.splice(toIndex, 0, moved);
  await saveData();
  renderApp();
  renderIngredientsModal();
  if(openMealId) renderDrawer();
}

async function reorderMealItems(mealId, fromId, toId){
  if(!fromId || !toId || fromId === toId) return;
  const meal = meals.find(m => m.id === mealId);
  if(!meal) return;
  const fromIndex = meal.items.findIndex(it => it.ingredientId === fromId);
  const toIndex = meal.items.findIndex(it => it.ingredientId === toId);
  if(fromIndex === -1 || toIndex === -1) return;
  const [moved] = meal.items.splice(fromIndex, 1);
  meal.items.splice(toIndex, 0, moved);
  await saveData();
  renderDrawer();
}

/* ===================== Helpers ===================== */
function uid(prefix){ return prefix + '-' + Math.random().toString(36).slice(2,9); }

/* ---- Date helpers (all local-time, avoid UTC shift) ---- */
function formatDateISO(d){
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function todayStr(){ return formatDateISO(new Date()); }
function parseISODate(ds){
  const [y,m,d] = ds.split('-').map(Number);
  return new Date(y, m-1, d);
}
function shiftDateStr(ds, days){
  const d = parseISODate(ds);
  d.setDate(d.getDate()+days);
  return formatDateISO(d);
}
function prettyDate(ds){
  const d = parseISODate(ds);
  return d.toLocaleDateString(undefined, {weekday:'short', day:'numeric', month:'short', year:'numeric'});
}
function shortDate(ds){
  const d = parseISODate(ds);
  return d.toLocaleDateString(undefined, {day:'numeric', month:'short'});
}

function getIngredient(id){ return ingredients.find(i => i.id === id); }

function itemKcal(item){
  const ing = getIngredient(item.ingredientId);
  if(!ing) return 0;
  return ing.unit === 'g' ? (item.amount/100)*ing.kcal : item.amount*ing.kcal;
}

function mealKcal(meal){
  return Math.round(meal.items.reduce((sum,it) => sum + itemKcal(it), 0));
}

function kcalColor(kcal){
  const cap = maintenanceCal > 0 ? maintenanceCal : 1800;
  const pct = cap > 0 ? kcal / cap : 0;
  if(pct < 0.5) return {solid:'var(--green)', soft:'var(--green-soft)'};
  if(pct < 0.6) return {solid:'var(--orange)', soft:'var(--orange-soft)'};
  return {solid:'var(--red)', soft:'var(--red-soft)'};
}

function dialHTML(kcal, big){
  const cap = maintenanceCal > 0 ? maintenanceCal : 1800;
  const pct = Math.max(0, Math.min(1, kcal/cap));
  const deg = Math.round(pct*360);
  const c = kcalColor(kcal);
  const cls = big ? 'dial drawer-dial' : 'dial';
  return `<div class="${cls}" style="background:conic-gradient(${c.solid} ${deg}deg, var(--surface-alt) ${deg}deg)">
    <div class="dial-inner">
      <div class="dial-kcal" style="color:${c.solid}">${kcal.toLocaleString()}</div>
      <div class="dial-kcal-label">kcal</div>
    </div>
  </div>`;
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

/* ===================== Render: single-page home ===================== */
function renderApp(){
  const log=getLog(logDate), deficit=logDeficit(log);
  const hist=computeHistory(14), max=Math.max(100,...hist.map(h=>Math.abs(h.deficit)));
  document.getElementById('app').innerHTML=`
    <div class="home">

function openFoodManager(){

    <h2>Meals &amp; snacks</h2>
    <div class="subtitle">Keep your saved foods tidy. Logging is done from the Log food button.</div>

      <div class="manager-group-head"><strong>Meals</strong><button class="btn btn-primary" id="foodMgrAddMeal">＋ New meal</button></div>

    </div>

      <div class="manager-group-head"><strong>Snacks</strong><button class="btn btn-secondary" id="foodMgrAddSnack">＋ New snack</button></div>

      : '<div class="empty-note">No meals yet.</div>';
    snacksHost.innerHTML=snacks.length
      ? snacks.map(s=>`<button class="manager-item manager-snack-edit" data-manager-edit-snack="${s.id}"><span><strong>${escapeHtml(s.name)}</strong><small>${s.kcal} kcal</small></span><span>›</span></button>`).join('')
      : '<div class="empty-note">No snacks yet.</div>';
    document.querySelectorAll('[data-manager-meal]').forEach(b=>b.onclick=()=>{closeTransferModal();openDrawer(b.dataset.managerMeal)});
    document.querySelectorAll('[data-manager-edit-snack]').forEach(b=>b.onclick=()=>openSnackEditor(b.dataset.managerEditSnack));
  };
  document.getElementById('foodMgrClose').onclick=closeTransferModal;
  document.getElementById('foodMgrAddMeal').onclick=async()=>{closeTransferModal();await addMeal()};
  document.getElementById('foodMgrAddSnack').onclick=()=>{

    document.getElementById('snackCreateClose').onclick=()=>openFoodManager();

      await addSnack(name,kcal);
      openFoodManager();
    };

function openSnackEditor(editId){
  const snack=snacks.find(s=>s.id===editId);
  if(!snack) return;
  transferModalOpen=true;
  const modal=document.getElementById('transferModal');
  modal.innerHTML=`<button class="drawer-close" id="snackEditClose" aria-label="Close">×</button><h2>Edit snack</h2><div class="subtitle">Update this saved snack.</div><div class="auth-field"><label>Name</label><input id="editSnackName" value="${escapeHtml(snack.name)}"></div><div class="auth-field"><label>Calories</label><input id="editSnackKcal" type="number" min="0" step="1" value="${snack.kcal}"></div><button class="btn btn-primary primary-wide" id="saveSnackEdit">Save changes</button><button class="btn btn-secondary primary-wide" id="deleteSnackEdit" style="margin-top:8px;">Delete snack</button>`;
  document.getElementById('transferModalBackdrop').classList.add('open');
  document.getElementById('snackEditClose').onclick=()=>openFoodManager();
  document.getElementById('saveSnackEdit').onclick=async()=>{
    const name=document.getElementById('editSnackName').value.trim();
    const kcal=parseFloat(document.getElementById('editSnackKcal').value);
    if(!name || !Number.isFinite(kcal) || kcal<0) return;
    snack.name=name; snack.kcal=Math.round(kcal);
    await saveData(); renderApp(); openFoodManager();
  };
  document.getElementById('deleteSnackEdit').onclick=async()=>{
    if(!confirm(`Delete "${snack.name}"?`)) return;
    snacks=snacks.filter(s=>s.id!==snack.id);
    await saveData(); renderApp(); closeTransferModal();
  };
}

/* ===================== Render: meals tab (legacy helpers retained) ===================== */
function renderMealsTab(){
  const totalKcal = meals.reduce((s,m) => s + mealKcal(m), 0);
  const avgKcal = meals.length ? Math.round(totalKcal/meals.length) : 0;

  const cards = meals.map((meal, idx) => {
    const kcal = mealKcal(meal);
    const previewNames = meal.items.slice(0,3).map(it => {
      const ing = getIngredient(it.ingredientId);
      return ing ? ing.name.split(' (')[0] : '';
    }).filter(Boolean);
    const more = meal.items.length > 3 ? `+${meal.items.length-3} more` : '';
    return `
      <div class="meal-card" tabindex="0" draggable="false" data-open-meal="${meal.id}" data-index="${idx}">
        <div class="drag-handle" data-drag-handle title="Drag to reorder">⠿</div>
        <button class="copy-handle" data-copy-meal="${meal.id}" title="Copy this meal">⧉</button>
        ${dialHTML(kcal, false)}
        <div class="meal-name">${escapeHtml(meal.name)}</div>
        <div class="meal-meta">${meal.items.length} ingredient${meal.items.length===1?'':'s'}</div>
        <div class="chip-row">
          ${previewNames.map(n => `<span class="chip">${escapeHtml(n)}</span>`).join('')}
          ${more ? `<span class="chip">${more}</span>` : ''}
        </div>
      </div>`;
  }).join('');

  document.getElementById('tabContent').innerHTML = `
    <div class="tab-toolbar">
      <button class="btn btn-secondary" id="openIngredientsBtn">Manage ingredients</button>
    </div>

    <div class="summary-bar">
      <div class="summary-stat">
        <div class="num mono">${meals.length}</div>
        <div class="label">Meals</div>
      </div>
      <div class="summary-stat">
        <div class="num mono">${avgKcal.toLocaleString()}</div>
        <div class="label">Avg kcal / meal</div>
      </div>
      <div class="summary-stat">
        <div class="num mono">${ingredients.length}</div>
        <div class="label">Ingredients on file</div>
      </div>
      <div class="summary-spacer"></div>
      <div class="summary-stat editable">
        <div class="num"><input class="maintenance-input" id="maintenanceInput" type="number" min="0" step="10" value="${maintenanceCal}" /></div>
        <div class="label">Maintenance kcal / day</div>
      </div>
    </div>

    <div class="meal-grid">
      ${cards}
      <button class="meal-card add-card" id="addMealBtn">
        <span class="plus">+</span>
        <span>New meal</span>
      </button>
    </div>

  `;

  document.querySelectorAll('[data-open-meal]').forEach(el => {
    el.addEventListener('click', (e) => {
      if(dragFromIndex !== null) return; // suppress click right after a drag
      openDrawer(el.getAttribute('data-open-meal'));
    });
    el.addEventListener('keydown', e => { if(e.key==='Enter') openDrawer(el.getAttribute('data-open-meal')); });

    el.addEventListener('dragstart', e => {
      dragFromIndex = parseInt(el.getAttribute('data-index'), 10);
      el.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
    });
    el.addEventListener('dragend', () => {
      el.classList.remove('dragging');
      el.setAttribute('draggable', 'false');
      document.querySelectorAll('.meal-card').forEach(c => c.classList.remove('drag-over'));
      setTimeout(() => { dragFromIndex = null; }, 0);
    });
    el.addEventListener('dragover', e => {
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      el.classList.add('drag-over');
    });
    el.addEventListener('dragleave', () => el.classList.remove('drag-over'));
    el.addEventListener('drop', e => {
      e.preventDefault();
      el.classList.remove('drag-over');
      const toIndex = parseInt(el.getAttribute('data-index'), 10);
      reorderMeals(dragFromIndex, toIndex);
    });
  });
  document.querySelectorAll('[data-drag-handle]').forEach(handle => {
    handle.addEventListener('mousedown', () => handle.closest('.meal-card').setAttribute('draggable', 'true'));
    handle.addEventListener('touchstart', () => handle.closest('.meal-card').setAttribute('draggable', 'true'), {passive:true});
  });
  document.querySelectorAll('[data-copy-meal]').forEach(btn => {
    btn.addEventListener('click', e => {
      e.stopPropagation();
      copyMeal(btn.getAttribute('data-copy-meal'));
    });
  });
  document.getElementById('addMealBtn').addEventListener('click', addMeal);
  document.getElementById('openIngredientsBtn').addEventListener('click', openIngredientsModal);
  document.getElementById('maintenanceInput').addEventListener('change', e => updateMaintenance(e.target.value));
}

/* ===================== Meal CRUD ===================== */
async function addMeal(){
  const meal = {id: uid('meal'), name:'New meal', items:[]};
  meals.push(meal);
  await saveData();
  renderApp();
  openDrawer(meal.id);
}

async function copyMeal(id){
  const original = meals.find(m => m.id === id);
  if(!original) return;
  const idx = meals.findIndex(m => m.id === id);
  const copy = {
    id: uid('meal'),
    name: original.name + ' (copy)',
    items: original.items.map(it => ({ingredientId: it.ingredientId, amount: it.amount})),
  };
  meals.splice(idx + 1, 0, copy);
  await saveData();
  renderApp();
  openDrawer(copy.id);
}

async function deleteMeal(id){
  if(!confirm('Delete this meal?')) return;
  meals = meals.filter(m => m.id !== id);
  await saveData();
  closeDrawer();
  renderApp();
}

async function renameMeal(id, name){
  const meal = meals.find(m => m.id === id);
  if(meal){ meal.name = name || 'Untitled meal'; await saveData(); renderApp(); }
}

async function updateItemAmount(mealId, ingredientId, amount){
  const meal = meals.find(m => m.id === mealId);
  const item = meal.items.find(it => it.ingredientId === ingredientId);
  if(item){
    item.amount = isNaN(amount) ? 0 : amount;
    await saveData();
    renderApp();
    renderDrawer();
  }
}

async function removeItem(mealId, ingredientId){
  const meal = meals.find(m => m.id === mealId);
  meal.items = meal.items.filter(it => it.ingredientId !== ingredientId);
  await saveData();
  renderApp();
  renderDrawer();
}

async function addItemToMeal(mealId, ingredientId, amount){
  if(!ingredientId) return;
  const meal = meals.find(m => m.id === mealId);
  if(meal.items.some(it => it.ingredientId === ingredientId)) return;
  meal.items.push({ingredientId, amount: isNaN(amount)||amount<=0 ? 1 : amount});
  await saveData();
  renderApp();
  renderDrawer();
}

/* ===================== Render: drawer ===================== */
function openDrawer(mealId){
  openMealId = mealId;
  renderDrawer();
  document.getElementById('drawer').classList.add('open');
  document.getElementById('drawerBackdrop').classList.add('open');
}

function closeDrawer(){
  document.getElementById('drawer').classList.remove('open');
  document.getElementById('drawerBackdrop').classList.remove('open');
  openMealId = null;
}

function renderDrawer(){
  const drawer = document.getElementById('drawer');
  if(!openMealId){ drawer.innerHTML = ''; return; }
  const meal = meals.find(m => m.id === openMealId);
  if(!meal){ closeDrawer(); return; }

  const kcal = mealKcal(meal);
  const usedIds = new Set(meal.items.map(it => it.ingredientId));
  const available = ingredients.filter(i => !usedIds.has(i.id));

  const rows = meal.items.map(it => {
    const ing = getIngredient(it.ingredientId);
    if(!ing) return '';
    return `
      <div class="item-row" draggable="false" data-item-id="${ing.id}">
        <div class="item-drag" data-item-drag title="Drag to reorder">⠿</div>
        <div class="item-name">${escapeHtml(ing.name)}</div>
        <input class="item-qty" type="number" step="any" min="0" value="${it.amount}"
          data-amount-for="${ing.id}" />
        <div class="item-unit">${ing.unit === 'g' ? 'g' : ''}</div>
        <div class="item-kcal mono">${Math.round(itemKcal(it))}</div>
        <button class="item-remove" data-remove="${ing.id}" aria-label="Remove ${escapeHtml(ing.name)}">×</button>
      </div>`;
  }).join('');

  drawer.innerHTML = `
    <div class="drawer-topbar"><span class="drawer-kicker">MEAL</span><button class="drawer-close" id="drawerCloseBtn" aria-label="Close">×</button></div>
    <input class="meal-name-input" id="mealNameInput" value="${escapeHtml(meal.name)}" />

    <div class="drawer-dial-wrap">${dialHTML(kcal, true)}</div>

    ${meal.items.length ? `<div class="item-head"><span></span><span>Name</span><span>Qty</span><span></span><span>Kcal</span><span></span></div>${rows}` : '<div class="empty-note">No ingredients yet — add one below.</div>'}

    <div class="add-item-row">
      <select class="add-item-select" id="addItemSelect">
        <option value="">Add an ingredient…</option>
        ${available.map(i => `<option value="${i.id}">${escapeHtml(i.name)} (${i.unit==='g'?'g':'each'})</option>`).join('')}
      </select>
      <input class="add-item-qty" type="number" step="any" min="0" placeholder="qty" id="addItemQty" />
      <button class="btn btn-primary" id="addItemBtn">Add</button>
    </div>

    <div class="drawer-footer">
      <button class="btn btn-danger" id="deleteMealBtn">Delete meal</button>
    </div>
  `;

  document.getElementById('drawerCloseBtn').addEventListener('click', closeDrawer);
  document.getElementById('mealNameInput').addEventListener('change', e => renameMeal(meal.id, e.target.value.trim()));
  document.getElementById('deleteMealBtn').addEventListener('click', () => deleteMeal(meal.id));
  document.getElementById('addItemBtn').addEventListener('click', () => {
    const sel = document.getElementById('addItemSelect');
    const qty = parseFloat(document.getElementById('addItemQty').value);
    addItemToMeal(meal.id, sel.value, qty);
  });
  drawer.querySelectorAll('[data-amount-for]').forEach(inp => {
    inp.addEventListener('change', e => updateItemAmount(meal.id, e.target.getAttribute('data-amount-for'), parseFloat(e.target.value)));
  });
  drawer.querySelectorAll('[data-remove]').forEach(btn => {
    btn.addEventListener('click', e => removeItem(meal.id, e.target.getAttribute('data-remove')));
  });
  drawer.querySelectorAll('.item-row').forEach(row => {
    const handle = row.querySelector('[data-item-drag]');
    if(handle){
      handle.addEventListener('mousedown', () => row.setAttribute('draggable', 'true'));
      handle.addEventListener('touchstart', () => row.setAttribute('draggable', 'true'), {passive:true});
    }
    row.addEventListener('dragstart', e => {
      itemDragFromId = row.getAttribute('data-item-id');
      row.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
    });
    row.addEventListener('dragend', () => {
      row.classList.remove('dragging');
      row.setAttribute('draggable', 'false');
      drawer.querySelectorAll('.item-row').forEach(r => r.classList.remove('drag-over'));
      setTimeout(() => { itemDragFromId = null; }, 0);
    });
    row.addEventListener('dragover', e => {
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      row.classList.add('drag-over');
    });
    row.addEventListener('dragleave', () => row.classList.remove('drag-over'));
    row.addEventListener('drop', e => {
      e.preventDefault();
      row.classList.remove('drag-over');
      reorderMealItems(meal.id, itemDragFromId, row.getAttribute('data-item-id'));
    });
  });
}

document.getElementById('drawerBackdrop').addEventListener('click', closeDrawer);

/* ===================== Ingredients modal ===================== */
function openIngredientsModal(){
  ingModalOpen = true;
  ingSearchTerm = '';
  renderIngredientsModal();
  document.getElementById('ingModalBackdrop').classList.add('open');
}
function closeIngredientsModal(){
  ingModalOpen = false;
  document.getElementById('ingModalBackdrop').classList.remove('open');
}

async function updateIngredientField(id, field, value){
  const ing = getIngredient(id);
  if(!ing) return;
  if(field === 'name') ing.name = value || ing.name;
  if(field === 'unit') ing.unit = value;
  if(field === 'kcal') ing.kcal = isNaN(value) ? ing.kcal : value;
  await saveData();
  renderApp();
  if(openMealId) renderDrawer();
}

async function deleteIngredient(id){
  const usedIn = meals.filter(m => m.items.some(it => it.ingredientId === id));
  if(usedIn.length){
    alert(`Can't delete — used in: ${usedIn.map(m=>m.name).join(', ')}. Remove it from those meals first.`);
    return;
  }
  if(!confirm('Delete this ingredient?')) return;
  ingredients = ingredients.filter(i => i.id !== id);
  await saveData();
  renderApp();
  renderIngredientsModal();
}

async function addIngredient(name, unit, kcal){
  if(!name || !name.trim()) return;
  ingredients.push({id: uid('ing'), name: name.trim(), unit: unit || 'g', kcal: isNaN(kcal) ? 0 : kcal});
  await saveData();
  renderApp();
  if(openMealId) renderDrawer();
  renderIngredientsModal();
}

function renderIngredientsModal(){
  const modal = document.getElementById('ingModal');
  if(!ingModalOpen){ modal.innerHTML = ''; return; }

  const term = ingSearchTerm.trim().toLowerCase();
  const filtered = term ? ingredients.filter(i => i.name.toLowerCase().includes(term)) : ingredients;
  const reorderable = !term; // reordering only makes sense against the full, unfiltered list

  const rows = filtered.map(ing => `
    <div class="ing-row" draggable="false" data-ing-id="${ing.id}">
      <div class="ing-drag ${reorderable ? '' : 'disabled'}" title="${reorderable ? 'Drag to reorder' : 'Clear search to reorder'}">⠿</div>
      <input value="${escapeHtml(ing.name)}" data-field="name" data-id="${ing.id}" />
      <select data-field="unit" data-id="${ing.id}">
        <option value="g" ${ing.unit==='g'?'selected':''}>g</option>
        <option value="each" ${ing.unit==='each'?'selected':''}>each</option>
      </select>
      <input class="kcal-input" type="number" step="any" min="0" value="${ing.kcal}" data-field="kcal" data-id="${ing.id}" />
      <button class="ing-remove" data-del="${ing.id}" aria-label="Delete ${escapeHtml(ing.name)}">×</button>
    </div>`).join('');

  modal.innerHTML = `
    <button class="drawer-close" id="ingModalCloseBtn" aria-label="Close" style="position:absolute;top:18px;right:18px;">×</button>
    <h2>Ingredients</h2>
    <div class="subtitle">Calories per 100g for weighed items, or per item for things you count.</div>
    <input class="ing-search" id="ingSearchInput" type="search" placeholder="Search ingredients…" value="${escapeHtml(ingSearchTerm)}" />
    ${term ? `<div class="ing-search-note">${filtered.length} of ${ingredients.length} shown — clear search to drag and reorder.</div>` : ''}
    <div class="ing-head"><span></span><span>Name</span><span>Unit</span><span>Kcal</span><span></span></div>
    ${filtered.length ? rows : '<div class="empty-note">No ingredients match that search.</div>'}
    <div class="section-label">Add new</div>
    <div class="add-ing-row">
      <span></span>
      <input id="newIngName" placeholder="Ingredient name" />
      <select id="newIngUnit">
        <option value="g">g</option>
        <option value="each">each</option>
      </select>

async function addSnack(name, kcal){

  snacks.push({id: uid('snack'), name: name.trim(), kcal: isNaN(kcal) ? 0 : kcal});
  await saveData();
  renderApp();
}

async function updateSnackField(id, field, value){
  const snack = snacks.find(s => s.id === id);
  if(!snack) return;
  if(field === 'name') snack.name = value || snack.name;
  if(field === 'kcal') snack.kcal = isNaN(value) ? snack.kcal : value;

}

/* ===================== Daily log: data + compute ===================== */
function getLog(dateStr){
  return logs[dateStr] || defaultLogEntry();
}
function ensureLog(dateStr){
  if(!logs[dateStr]) logs[dateStr] = defaultLogEntry();
  return logs[dateStr];
}

function logMealKcal(log){
  if(log.mode === 'custom') return Math.round(log.manualMealKcal || 0);
  const meal = meals.find(m => m.id === log.mealId);
  if(!meal) return 0;
  return Math.round(mealKcal(meal) * (log.mealServings || 1));
}
function logSnacksKcal(log){
  return Math.round((log.snacks || []).reduce((sum, e) => {
    const snack = snacks.find(s => s.id === e.snackId);
    return sum + (snack ? snack.kcal * e.qty : 0);
  }, 0));
}
function logTotalKcal(log){ return logMealKcal(log) + logSnacksKcal(log); }
function logDeficit(log){ return maintenanceCal - logTotalKcal(log); }
function logHasEntries(log){ return !!log && (log.mode === 'custom' ? (log.manualMealKcal > 0 || !!log.manualMealName) : !!log.mealId) || (log && log.snacks && log.snacks.length > 0); }

/* ===================== Daily log: mutators ===================== */
function refreshLog(){
  // The app is now single-page; there is no #tabContent.
  // Re-render the home screen and keep the food modal open if needed.
  renderApp();
  if(logFoodModalOpen) renderLogFoodModal();
}
async function setLogMode(dateStr, mode){
  const log = ensureLog(dateStr);
  log.mode = mode;
  await saveData();
  refreshLog();
}
async function setLogMeal(dateStr, mealId){
  const log = ensureLog(dateStr);
  log.mealId = mealId || null;
  await saveData();
  refreshLog();
}
async function setLogMealServings(dateStr, servings){
  const log = ensureLog(dateStr);
  log.mealServings = isNaN(servings) || servings <= 0 ? 1 : servings;
  await saveData();
  refreshLog();
}
async function setManualMeal(dateStr, name, kcal){
  const log = ensureLog(dateStr);
  log.manualMealName = name;
  log.manualMealKcal = isNaN(kcal) ? 0 : kcal;
  await saveData();
  refreshLog();
}
async function addLogSnack(dateStr, snackId, qty){
  if(!snackId) return;
  const log = ensureLog(dateStr);
  const q = (isNaN(qty) || qty <= 0) ? 1 : qty;
  const existing = log.snacks.find(e => e.snackId === snackId);
  if(existing) existing.qty += q;
  else log.snacks.push({snackId, qty: q});
  await saveData();
  refreshLog();
}
async function updateLogSnackQty(dateStr, snackId, qty){
  const log = ensureLog(dateStr);
  const entry = log.snacks.find(e => e.snackId === snackId);
  if(entry){
    entry.qty = isNaN(qty) || qty <= 0 ? entry.qty : qty;
    await saveData();
    refreshLog();
  }
}
async function removeLogSnack(dateStr, snackId){
  const log = ensureLog(dateStr);
  log.snacks = log.snacks.filter(e => e.snackId !== snackId);
  await saveData();
  refreshLog();
}
async function clearLogDay(dateStr){
  if(!confirm('Clear everything logged for this day?')) return;
  delete logs[dateStr];
  await saveData();
  refreshLog();
}
async function setLogDateView(dateStr){
  logDate = dateStr;
  closeLogFoodModal();
  renderApp();
}
async function setChartRange(days){
  chartRangeDays = days;
  if(currentTab === 'history') renderHistoryTab();
}

/* ===================== Daily log: render (main tab) ===================== */
function computeHistory(days){
  const arr = [];
  for(let i = days - 1; i >= 0; i--){
    const ds = shiftDateStr(todayStr(), -i);
    const log = logs[ds];
    const has = logHasEntries(log);
    arr.push({date: ds, total: log ? logTotalKcal(log) : 0, deficit: log ? logDeficit(log) : 0, hasLog: has});
  }
  return arr;
}

function dayPieHTML(log){
  const meal=Math.max(0,logMealKcal(log));
  const snack=Math.max(0,logSnacksKcal(log));
  const foodTotal=meal+snack;
  const deficit=Math.max(0, maintenanceCal-foodTotal);
  const pieTotal=Math.max(maintenanceCal, foodTotal);
  if(!pieTotal)return `<div class="day-pie" style="background:var(--surface-alt);"><div class="day-pie-inner"><div class="day-pie-kcal">0</div><div class="day-pie-label">kcal</div></div></div>`;
  const mealDeg=meal/pieTotal*360;
  const snackDeg=(meal+snack)/pieTotal*360;
  const deficitDeg=(meal+snack+deficit)/pieTotal*360;
  const gradient=deficit>0
    ? `conic-gradient(var(--green) 0deg ${mealDeg}deg, #8EAB94 ${mealDeg}deg ${snackDeg}deg, var(--green-soft) ${snackDeg}deg ${deficitDeg}deg, var(--surface-alt) ${deficitDeg}deg 360deg)`
    : `conic-gradient(var(--green) 0deg ${mealDeg}deg, #8EAB94 ${mealDeg}deg ${snackDeg}deg, var(--surface-alt) ${snackDeg}deg 360deg)`;
  return `<div class="day-pie" style="background:${gradient};"><div class="day-pie-inner"><div class="day-pie-kcal">${foodTotal.toLocaleString()}</div><div class="day-pie-label">kcal</div></div></div>`;
}

function renderHistoryTab(){
  const history=computeHistory(chartRangeDays),maxAbs=Math.max(100,...history.map(h=>Math.abs(h.deficit))),loggedDays=history.filter(h=>h.hasLog);
  const avgDeficit=loggedDays.length?Math.round(loggedDays.reduce((s,h)=>s+h.deficit,0)/loggedDays.length):0;
  let streak=0;for(let i=history.length-1;i>=0;i--){if(history[i].hasLog&&history[i].deficit>0)streak++;else break;}
  const chartCols=history.map(h=>{let topBar='',botBar='';if(!h.hasLog)topBar='<div class="chart-bar empty" style="height:3px"></div>';else if(h.deficit>=0)topBar=`<div class="chart-bar" style="height:${Math.max(2,Math.round(Math.abs(h.deficit)/maxAbs*78))}px"></div>`;else botBar=`<div class="chart-bar neg" style="height:${Math.max(2,Math.round(Math.abs(h.deficit)/maxAbs*78))}px"></div>`;const label=h.hasLog?`${h.deficit>=0?'−':'+'}${Math.abs(h.deficit)}`:'';const tip=h.hasLog?`${prettyDate(h.date)}: ${h.total} kcal — ${h.deficit>=0?h.deficit+' kcal deficit':Math.abs(h.deficit)+' kcal surplus'}`:`${prettyDate(h.date)}: nothing logged`;return `<div class="chart-col" title="${escapeHtml(tip)}"><div class="history-deficit-label">${label}</div><div class="chart-bars"><div class="chart-zone top">${topBar}</div><div class="chart-zone bottom">${botBar}</div></div><div class="chart-date">${parseISODate(h.date).getDate()}</div></div>`;}).join('');
  document.getElementById('tabContent').innerHTML=`<div class="card"><div class="chart-header"><h3 style="margin:0;">Deficit history</h3><div class="range-toggle"><button class="range-btn ${chartRangeDays===7?'active':''}" data-range="7">7d</button><button class="range-btn ${chartRangeDays===14?'active':''}" data-range="14">14d</button><button class="range-btn ${chartRangeDays===30?'active':''}" data-range="30">30d</button></div></div><div class="summary-bar" style="margin-bottom:18px;"><div class="summary-stat"><div class="num mono">${loggedDays.length}</div><div class="label">Days logged</div></div><div class="summary-stat"><div class="num mono" style="color:${avgDeficit>=0?'var(--green)':'var(--red)'}">${avgDeficit>=0?'−':'+'}${Math.abs(avgDeficit).toLocaleString()}</div><div class="label">Avg ${avgDeficit>=0?'deficit':'surplus'} / day</div></div><div class="summary-stat"><div class="num mono">${streak}</div><div class="label">Day streak in deficit</div></div></div><div class="chart-legend"><span><span class="legend-dot" style="background:var(--green);"></span>Deficit (under maintenance)</span><span><span class="legend-dot" style="background:var(--red);"></span>Surplus (over maintenance)</span><span><span class="legend-dot" style="background:var(--line);"></span>Not logged</span></div><div class="chart-scroll" style="margin-top:14px;"><div class="chart-track">${chartCols}</div></div></div>`;
  document.querySelectorAll('.range-btn').forEach(btn=>btn.addEventListener('click',()=>setChartRange(parseInt(btn.dataset.range,10))));
}

function renderLogTab(){
  const log = getLog(logDate);
  const totalKcal = logTotalKcal(log);
  const deficit = logDeficit(log);
  const isToday = logDate === todayStr();
  const hasEntries = logHasEntries(log);

  const mealChip = (() => {
    if(log.mode === 'custom'){
      if(!log.manualMealName && !log.manualMealKcal) return '';
      return `<div class="log-chip"><span>${escapeHtml(log.manualMealName || 'Custom meal')}</span><span class="lc-kcal">${Math.round(log.manualMealKcal||0)} kcal</span></div>`;
    }
    const meal = meals.find(m => m.id === log.mealId);
    if(!meal) return '';
    const servings = log.mealServings || 1;
    return `<div class="log-chip"><span>${escapeHtml(meal.name)}${servings !== 1 ? ` ×${servings}` : ''}</span><span class="lc-kcal">${logMealKcal(log)} kcal</span></div>`;
  })();

  const snackChips = (log.snacks || []).map(e => {
    const snack = snacks.find(s => s.id === e.snackId);
    if(!snack) return '';
    return `<div class="log-chip"><span>${escapeHtml(snack.name)}${e.qty !== 1 ? ` ×${e.qty}` : ''}</span><span class="lc-kcal">${Math.round(snack.kcal*e.qty)} kcal</span></div>`;
  }).join('');

  const history = computeHistory(chartRangeDays);
  const maxAbs = Math.max(100, ...history.map(h => Math.abs(h.deficit)));
  const loggedDays = history.filter(h => h.hasLog);
  const avgDeficit = loggedDays.length ? Math.round(loggedDays.reduce((s,h)=>s+h.deficit,0)/loggedDays.length) : 0;
  let streak = 0;
  for(let i = history.length - 1; i >= 0; i--){
    if(history[i].hasLog && history[i].deficit > 0) streak++;
    else break;
  }

  const chartCols = history.map(h => {
    let topBar = '', botBar = '';
    if(!h.hasLog){
      topBar = `<div class="chart-bar empty" style="height:3px"></div>`;
    } else if(h.deficit >= 0){
      const height = Math.max(2, Math.round((Math.abs(h.deficit)/maxAbs)*78));
      topBar = `<div class="chart-bar" style="height:${height}px"></div>`;
    } else {
      const height = Math.max(2, Math.round((Math.abs(h.deficit)/maxAbs)*78));
      botBar = `<div class="chart-bar neg" style="height:${height}px"></div>`;
    }
    const tip = h.hasLog
      ? `${prettyDate(h.date)}: ${h.total} kcal — ${h.deficit>=0 ? h.deficit+' kcal deficit' : Math.abs(h.deficit)+' kcal surplus'}`
      : `${prettyDate(h.date)}: nothing logged`;
    return `
      <div class="chart-col" title="${escapeHtml(tip)}">
        <div class="chart-bars">
          <div class="chart-zone top">${topBar}</div>
          <div class="chart-zone bottom">${botBar}</div>
        </div>
        <div class="chart-date">${parseISODate(h.date).getDate()}</div>
      </div>`;
  }).join('');

  document.getElementById('tabContent').innerHTML = `
    <div class="log-date-nav">
      <button class="date-arrow" id="prevDayBtn" aria-label="Previous day">‹</button>
      <input class="log-date-input" type="date" id="logDateInput" value="${logDate}" max="${todayStr()}" />
      <button class="date-arrow" id="nextDayBtn" aria-label="Next day" ${isToday?'disabled style="opacity:.35;cursor:default;"':''}>›</button>
      <div class="log-date-label">${prettyDate(logDate)}${isToday ? ' · Today' : ''}</div>
    </div>

    <div class="card day-summary-card">
      <div class="day-summary">
        ${dayPieHTML(log)}
        <div class="day-stat">
          <div class="num mono">${maintenanceCal.toLocaleString()}</div>
          <div class="label">Maintenance</div>
        </div>
        <div class="day-stat deficit">
          <div class="num mono ${deficit>=0?'pos':'neg'}">${deficit>=0 ? '−' : '+'}${Math.abs(deficit).toLocaleString()}</div>
          <div class="label">${deficit>=0 ? 'Deficit' : 'Surplus'}</div>
        </div>
      </div>
      <div class="pie-legend"><span class="pie-legend-item"><span class="pie-dot" style="background:var(--green);"></span>Main meal</span><span class="pie-legend-item"><span class="pie-dot" style="background:#8EAB94;"></span>Snacks</span><span class="pie-legend-item"><span class="pie-dot" style="background:var(--green-soft);"></span>Deficit</span></div>
    </div>

    <div class="card">
      <div class="log-food-header">
        <h3>Food logged</h3>
        <button class="btn btn-primary" id="openLogFoodBtn">${hasEntries ? 'Edit log' : 'Log food'}</button>
      </div>
      <div class="log-chip-group">
        <div class="log-chip-group-label">Main meal</div>
        ${mealChip ? `<div class="log-chip-row">${mealChip}</div>` : '<div class="log-food-empty">Nothing logged yet.</div>'}
      </div>
      <div class="log-chip-group" style="margin-bottom:0;">
        <div class="log-chip-group-label">Snacks</div>
        ${snackChips ? `<div class="log-chip-row">${snackChips}</div>` : '<div class="log-food-empty">No snacks logged yet.</div>'}
      </div>
      ${hasEntries ? '<button class="btn btn-danger" style="margin-top:16px;" id="clearDayBtn">Clear day</button>' : ''}
    </div>

  `;

  document.getElementById('prevDayBtn').addEventListener('click', () => setLogDateView(shiftDateStr(logDate, -1)));
  document.getElementById('nextDayBtn').addEventListener('click', () => { if(!isToday) setLogDateView(shiftDateStr(logDate, 1)); });
  document.getElementById('logDateInput').addEventListener('change', e => { if(e.target.value) setLogDateView(e.target.value); });

  document.getElementById('openLogFoodBtn').addEventListener('click', openLogFoodModal);

  const clearBtn = document.getElementById('clearDayBtn');
  if(clearBtn) clearBtn.addEventListener('click', () => clearLogDay(logDate));

  document.querySelectorAll('.range-btn').forEach(btn => {
    btn.addEventListener('click', () => setChartRange(parseInt(btn.getAttribute('data-range'), 10)));
  });
}

/* ===================== Export / Import ===================== */
function openTransferModal(){
  transferModalOpen = true;
  renderTransferModal();
  document.getElementById('transferModalBackdrop').classList.add('open');
}
function closeTransferModal(){
  transferModalOpen = false;
  document.getElementById('transferModalBackdrop').classList.remove('open');
}

function currentExportJSON(){
  return JSON.stringify({ingredients, meals, snacks, logs, maintenanceCal}, null, 2);
}

function downloadExport(){
  const blob = new Blob([currentExportJSON()], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'meal-builder-export.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

async function importFromText(text, msgEl){
  try{
    const parsed = JSON.parse(text);
    if(!Array.isArray(parsed.ingredients) || !Array.isArray(parsed.meals)){
      throw new Error('File is missing an ingredients or meals list.');
    }
    ingredients = parsed.ingredients;
    meals = parsed.meals;
    snacks = Array.isArray(parsed.snacks) ? parsed.snacks : [];
    logs = (parsed.logs && typeof parsed.logs === 'object') ? parsed.logs : {};
    maintenanceCal = parsed.maintenanceCal || DEFAULT_MAINTENANCE;
    await saveData();
    renderApp();
    if(msgEl){ msgEl.textContent = `Imported ${meals.length} meals, ${ingredients.length} ingredients and ${snacks.length} snacks.`; msgEl.className = 'import-msg ok'; }
  } catch(e){
    console.error(e);
    if(msgEl){ msgEl.textContent = 'Could not import that file — check it\'s a Meal Builder export.'; msgEl.className = 'import-msg err'; }
  }
}

function renderTransferModal(){
  const modal = document.getElementById('transferModal');
  if(!transferModalOpen){ modal.innerHTML = ''; return; }
  modal.innerHTML = `
    <button class="drawer-close" id="transferCloseBtn" aria-label="Close" style="position:absolute;top:18px;right:18px;">×</button>
    <h2>Export &amp; import</h2>
    <div class="subtitle">Move your meals and ingredients to another device, or back them up.</div>

    <div class="section-label" style="margin-top:18px;">Export</div>
    <button class="btn btn-primary" id="downloadBtn">Download .json file</button>
    <textarea class="export-textarea" id="exportText" readonly>${escapeHtml(currentExportJSON())}</textarea>
    <div class="subtitle" style="margin-top:4px;">Or select the text above and copy it directly.</div>

    <div class="section-label">Import</div>
    <div class="import-row">
      <label class="file-label">
        Choose a .json file
        <input type="file" accept="application/json,.json" id="importFile" style="display:none;">
      </label>
      <button class="btn btn-secondary" id="importPasteBtn">Paste JSON instead</button>
    </div>
    <textarea class="export-textarea" id="importText" style="display:none;" placeholder="Paste exported JSON here"></textarea>
    <button class="btn btn-primary" id="importPasteConfirm" style="display:none;margin-top:8px;">Import pasted data</button>
    <div class="import-msg" id="importMsg"></div>

    <div class="modal-footer">
      <span class="subtitle" style="margin:0;">Importing replaces everything currently saved.</span>
      <button class="btn btn-secondary" id="transferDoneBtn">Done</button>
    </div>
  `;

  document.getElementById('transferCloseBtn').addEventListener('click', closeTransferModal);
  document.getElementById('transferDoneBtn').addEventListener('click', closeTransferModal);
  document.getElementById('downloadBtn').addEventListener('click', downloadExport);

  document.getElementById('importFile').addEventListener('change', e => {
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = () => importFromText(reader.result, document.getElementById('importMsg'));
    reader.readAsText(file);
  });

  document.getElementById('importPasteBtn').addEventListener('click', () => {
    document.getElementById('importText').style.display = 'block';
    document.getElementById('importPasteConfirm').style.display = 'inline-flex';
  });
  document.getElementById('importPasteConfirm').addEventListener('click', () => {
    const text = document.getElementById('importText').value;
    importFromText(text, document.getElementById('importMsg'));
  });
}

document.getElementById('transferModalBackdrop').addEventListener('click', e => {
  if(e.target.id === 'transferModalBackdrop') closeTransferModal();
});

/* ===================== Init ===================== */
initAuth();
</script>
</body>
