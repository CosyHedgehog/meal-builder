<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meal Builder</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍋</text></svg>">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/drawer.css">
<link rel="stylesheet" href="css/modal.css">
<link rel="stylesheet" href="css/auth.css">
<link rel="stylesheet" href="css/home.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body>

<div class="app-shell" id="app">
  <div class="loading-state" id="loading">Loading your pantry…</div>
</div>

<div class="backdrop" id="drawerBackdrop"></div>
<div class="drawer" id="drawer"></div>

<div class="modal-backdrop" id="ingModalBackdrop">
  <div class="modal" id="ingModal"></div>
</div>

<div class="modal-backdrop" id="transferModalBackdrop">
  <div class="modal" id="transferModal"></div>
</div>

<div class="modal-backdrop" id="historyModalBackdrop">
  <div class="modal" id="historyModal"></div>
</div>

<div class="modal-backdrop" id="confirmModalBackdrop">
  <div class="modal confirm-modal" id="confirmModal">
    <h2 id="confirmTitle">Confirm</h2>
    <div class="subtitle" id="confirmMessage">Are you sure?</div>
    <div class="modal-footer" id="confirmFooter">
      <button class="btn btn-secondary" id="confirmCancelBtn">Cancel</button>
      <button class="btn btn-danger-outline" id="confirmOkBtn">Delete</button>
    </div>
  </div>
</div>

<!--
  Scripts are loaded in dependency order as plain classic scripts (no
  bundler, no modules) so they share one global scope, exactly like the
  original single-file app. utils.js loads first because state.js calls
  todayStr() immediately at the top level; main.js must load last (it
  calls initAuth() and expects everything else to already be defined).
-->
<script src="js/utils.js"></script>
<script src="js/state.js"></script>
<script src="js/api.js"></script>
<script src="js/confirm.js"></script>
<script src="js/auth.js"></script>
<script src="js/home.js"></script>
<script src="js/meals.js"></script>
<script src="js/ingredients.js"></script>
<script src="js/snacks.js"></script>
<script src="js/log.js"></script>
<script src="js/transfer.js"></script>
<script src="js/history.js"></script>
<script src="js/main.js"></script>
</body>
</html>
